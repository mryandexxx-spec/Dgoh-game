<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dune: Galaxy of Houses</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dune GoH">
<meta name="theme-color" content="#170f09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one-screen game shell — resource bar, tabbed hub (campaign path / roster / rules), full-screen battle overlay with enemy row above, ally row below. Night over the Shield Wall: deep violet-black, melange amber, Ibad blue for shields. */
:root {
  --night: #170f09; --dune: #231810; --ridge: #302216; --line: #4e3a26;
  --bone: #f4e7cf; --dust: #bca685; --spice: #e8913f; --spice-dim: #8a5328;
  --ibad: #6fb3ea; --hp: #7fbb6c; --foe: #d9604f; --tm: #d9c7a0;
  --atr: #5aa877; --hark: #8597de; --cor: #d4ab4c; --frem: #cf8f5e; --bg: #b9a6dc; --worm: #e0c08a; --mach: #c8ccd4; --light: #4f8fe0; --dark: #d0473a;
  --f-display: 'Forum', 'Times New Roman', serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body { overflow-x: hidden; }
body { background: var(--night); color: var(--bone); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--dune); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--spice); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(180deg, var(--dune), var(--night)); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 0; }
.brand { font-family: var(--f-display); font-size: 26px; letter-spacing: .14em; line-height: 1; }
.brand small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .32em; color: var(--spice); margin-top: 4px; }
.res { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.pill { display: flex; flex-direction: column; padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; min-width: 84px; }
.pill b { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dust); }
nav.tabs { display: flex; gap: 2px; width: 100%; margin-top: 6px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--dust); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
nav.tabs button[aria-selected="true"] { color: var(--bone); border-color: var(--spice); }
main { padding-block: 20px 60px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .06em; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--dust); margin: 0 0 18px; max-width: 65ch; }

/* campaign */
.path { display: grid; gap: 10px; }
.chap { font-family: var(--f-mono); font-size: 11px; letter-spacing: .24em; color: var(--spice); text-transform: uppercase; margin: 14px 0 0; }
.node { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; background: var(--dune); border: 1px solid var(--line); border-radius: 4px; }
.node.locked { opacity: .45; }
.node .num { font-family: var(--f-display); font-size: 26px; text-align: center; color: var(--dust); }
.node h3 { margin: 0; font-weight: 600; font-size: 15px; }
.node .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--dust); font-size: 12px; margin-top: 4px; align-items: center; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.gl { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; border: 2px solid var(--fc, var(--dust)); background: var(--ridge); letter-spacing: 0; }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; padding: 2px 6px; border-radius: 2px; border: 1px solid var(--line); color: var(--dust); text-transform: uppercase; }
.tag.desert { border-color: var(--frem); color: var(--frem); }
.stars { color: var(--spice); letter-spacing: 1px; font-size: 13px; }
.stars i { color: var(--line); font-style: normal; }
.btn { background: var(--ridge); border: 1px solid var(--line); border-radius: 3px; padding: 8px 14px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--dust); }
.btn.go { background: var(--spice); color: #1a1008; border-color: var(--spice); font-weight: 600; }
.btn.go:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn small { display: block; font-size: 10px; font-weight: 400; opacity: .8; font-family: var(--f-mono); }
.power { font-family: var(--f-mono); font-size: 12px; }
.power.bad { color: var(--foe); } .power.ok { color: var(--hp); }

/* squad + roster */
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 22px; }
.slot { border: 1px dashed var(--line); border-radius: 4px; padding: 10px 6px; text-align: center; min-height: 104px; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.slot.filled { border-style: solid; background: var(--dune); }
.slot .lab { font-family: var(--f-mono); font-size: 9px; letter-spacing: .2em; color: var(--dust); text-transform: uppercase; }
.slot.lead .lab { color: var(--spice); }
.slot .gl { width: 40px; height: 40px; font-size: 13px; }
.slot .nm { font-size: 12px; line-height: 1.2; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.filters button { background: none; border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--dust); }
.filters button[aria-pressed="true"] { color: var(--bone); border-color: var(--fc, var(--spice)); }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.rc { background: var(--dune); border: 1px solid var(--line); border-radius: 4px; padding: 12px 10px 10px; text-align: left; display: grid; gap: 6px; position: relative; }
.rc.insq { border-color: var(--spice-dim); }
.rc.insq::after { content: "В ОТРЯДЕ"; position: absolute; top: 8px; right: 8px; font-family: var(--f-mono); font-size: 8px; letter-spacing: .14em; color: var(--spice); }
.rc.lockd .gl, .rc.lockd .nm { opacity: .45; }
.rc .gl { width: 38px; height: 38px; font-size: 12px; }
.rc .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
.rc .rl { font-size: 11px; color: var(--dust); }
.rc .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 11px; color: var(--dust); }
.shbar { height: 4px; background: var(--ridge); border-radius: 2px; overflow: hidden; }
.shbar i { display: block; height: 100%; background: var(--spice); }

.detail { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; background: rgb(14 9 5 / .6); }
.sheet { width: min(640px, 100%); max-height: 92%; overflow: auto; background: var(--dune); border: 1px solid var(--line); border-radius: 8px 8px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet .hd { display: flex; gap: 14px; align-items: center; }
.sheet .hd .gl { width: 56px; height: 56px; font-size: 18px; border-width: 3px; }
.sheet h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.1; }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 16px 0; }
.statgrid div { background: var(--dune); padding: 8px; }
.statgrid span { display: block; font-size: 10px; color: var(--dust); text-transform: uppercase; letter-spacing: .1em; }
.statgrid b { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.ab { border-top: 1px solid var(--line); padding: 10px 0; }
.ab h4 { margin: 0 0 2px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ab h4 .tag { font-weight: 400; }
.ab p { margin: 0; color: var(--dust); font-size: 13px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.rules { display: grid; gap: 18px; max-width: 760px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dust); font-weight: 500; }
.rules p { margin: 0; max-width: 65ch; }
.rules a { color: var(--spice); }

/* battle */
.battle { position: fixed; inset: 0; z-index: 30; background: radial-gradient(120% 60% at 50% 110%, #2b1d14 0%, var(--night) 60%); display: flex; flex-direction: column; overflow: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.battle.desert { background: radial-gradient(120% 70% at 50% 115%, #4a2d17 0%, #1c130f 55%, var(--night) 100%); }
.bwrap { width: 100%; max-width: 980px; margin: 0 auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.bbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bbar h3 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0 auto 0 0; letter-spacing: .05em; }
.bbar .btn { padding: 6px 10px; font-size: 12px; }
.btn[aria-pressed="true"] { border-color: var(--spice); color: var(--spice); }
.order { display: flex; gap: 4px; align-items: center; overflow: hidden; }
.order .lbl { font-family: var(--f-mono); font-size: 9px; letter-spacing: .18em; color: var(--dust); margin-right: 4px; }
.order .gl { width: 24px; height: 24px; font-size: 9px; }
.order .gl.e { background: #3a1d1c; }
.row5 { display: flex; justify-content: center; gap: 6px; }
.row5 > .card { flex: 0 1 calc((100% - 24px) / 5); }
.card { position: relative; background: rgb(35 24 16 / .88); border: 1px solid var(--line); border-radius: 4px; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; transition: transform .15s, border-color .15s; }
.card.dead { opacity: .25; filter: grayscale(1); }
.card.active { border-color: var(--spice); box-shadow: 0 0 0 1px var(--spice), 0 0 18px rgb(228 138 60 / .35); }
.card.tgt { border-color: var(--foe); cursor: pointer; }
.card.tgt:hover, .card.tgt:focus-visible { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--foe); }
.card.hit { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.card .gl { width: 42px; height: 42px; font-size: 13px; }
.card .lead { position: absolute; top: 4px; left: 5px; font-family: var(--f-mono); font-size: 9px; color: var(--spice); letter-spacing: .1em; }
.card .nm { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.15; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars { width: 100%; display: grid; gap: 2px; }
.bar { height: 6px; background: rgb(255 255 255 / .07); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar.hp i { background: var(--hp); }
.side-B .bar.hp i { background: var(--foe); }
.bar.sh { height: 4px; } .bar.sh i { background: var(--ibad); }
.bar.tm { height: 2px; } .bar.tm i { background: var(--tm); transition: none; }
.nums { font-family: var(--f-mono); font-size: 9px; color: var(--dust); width: 100%; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.fxs { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; min-height: 14px; }
.fx { font-family: var(--f-mono); font-size: 8px; padding: 1px 3px; border-radius: 2px; background: rgb(127 187 108 / .2); color: var(--hp); }
.fx.bad { background: rgb(217 96 79 / .22); color: var(--foe); }
.intent { font-family: var(--f-mono); font-size: 9px; color: var(--ibad); text-align: center; line-height: 1.2; min-height: 11px; }
.float { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-family: var(--f-mono); font-weight: 600; font-size: 13px; pointer-events: none; animation: rise 1.1s ease-out forwards; white-space: nowrap; text-shadow: 0 1px 2px #000; z-index: 2; }
.float.dmg, .float.raw, .float.poison { color: #ffb4a8; } .float.crit { color: #fff; font-size: 15px; }
.float.shield { color: var(--ibad); } .float.heal { color: var(--hp); } .float.miss { color: var(--dust); }
.float.buff { color: var(--hp); font-size: 10px; } .float.debuff { color: var(--foe); font-size: 10px; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -34px); } }
.mid { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.gauges { display: grid; gap: 8px; align-content: start; background: rgb(24 16 10 / .78); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.gauge span { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; color: var(--dust); }
.gauge .bar { height: 8px; } .gauge.sp .bar i { background: var(--spice); } .gauge.spe .bar i { background: var(--spice-dim); }
.gauge.worm .bar { background: repeating-linear-gradient(90deg, rgb(255 255 255 / .07) 0 9%, transparent 9% 10%); }
.gauge.worm .bar i { background: var(--frem); }
.logbox { background: rgb(24 16 10 / .82); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 12px; height: 128px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-width: 0; }
.logbox div { color: var(--dust); }
.logbox .actA { color: var(--bone); } .logbox .actB { color: #e6b7ae; }
.logbox .holtz { color: var(--ibad); font-weight: 600; } .logbox .worm { color: var(--frem); font-weight: 600; } .logbox .death { color: var(--foe); } .logbox .ctrl { color: var(--bg); }
.abar { min-height: 92px; display: grid; gap: 6px; }
.abar .who { font-size: 12px; color: var(--dust); background: rgb(24 16 10 / .7); padding: 4px 8px; border-radius: 3px; justify-self: start; }
.abar .who b { color: var(--bone); }
.abtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.abtn { text-align: left; background: var(--dune); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.abtn[aria-pressed="true"] { border-color: var(--spice); background: var(--ridge); }
.abtn b { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.abtn b em { font-style: normal; font-family: var(--f-mono); font-size: 10px; color: var(--spice); font-weight: 400; }
.abtn span { display: block; font-size: 11px; color: var(--dust); line-height: 1.3; margin-top: 2px; }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.flash.holtz { animation: fh .7s ease-out; background: radial-gradient(circle, rgb(200 230 255 / .85), rgb(111 179 234 / .2) 60%, transparent); }
.flash.worm { animation: fh 1s ease-out; background: radial-gradient(ellipse at 50% 100%, rgb(207 143 94 / .7), transparent 70%); }
.battle.quake .bwrap { animation: quake .6s; }
@keyframes fh { from { opacity: 1; } to { opacity: 0; } }
@keyframes quake { 20%, 60% { transform: translate(-4px, 2px); } 40%, 80% { transform: translate(4px, -2px); } }
.result { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgb(14 9 5 / .72); padding: 16px; }
.result .box { background: var(--dune); border: 1px solid var(--line); border-radius: 6px; padding: 24px; width: min(460px, 100%); max-height: calc(100dvh - 24px); overflow: auto; text-align: center; display: grid; gap: 12px; }
.result .acts { position: sticky; bottom: -24px; padding: 8px 0 4px; background: linear-gradient(180deg, transparent, var(--dune) 30%); flex-wrap: wrap; }
.result h3 { font-family: var(--f-display); font-weight: 400; font-size: 36px; margin: 0; letter-spacing: .1em; }
.result .stars { font-size: 26px; }
.result ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13px; color: var(--dust); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ridge); border: 1px solid var(--spice-dim); padding: 8px 14px; border-radius: 4px; z-index: 50; font-size: 13px; }

/* raid / legend / shop */
.panel { background: var(--dune); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .04em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.pool { position: relative; height: 18px; background: var(--ridge); border-radius: 2px; overflow: hidden; }
.pool i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #8a5a2e, var(--worm)); }
.pool b { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--night); }
.poolnums { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--dust); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { display: flex; align-items: center; gap: 6px; background: var(--ridge); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px 3px 3px; font-size: 12px; }
.pick button[aria-pressed="true"] { border-color: var(--spice); background: #3a2716; }
.pick button:disabled { opacity: .35; text-decoration: line-through; }
.pick button .ord { font-family: var(--f-mono); font-size: 10px; color: var(--spice); min-width: 10px; }
.pick .gl { width: 24px; height: 24px; font-size: 9px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv span { color: var(--dust); }
.alog { font-size: 12px; color: var(--dust); display: grid; gap: 3px; max-height: 160px; overflow: auto; }
.alog div { display: flex; justify-content: space-between; gap: 10px; }
.tiers { display: grid; gap: 8px; }
.tier { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--dune); }
.tier .num { font-family: var(--f-display); font-size: 22px; color: var(--dust); text-align: center; }
.tier.done .num { color: var(--spice); }
.tier h4 { margin: 0; font-size: 14px; }
.req { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.req div { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; }
.req .ok { color: var(--hp); } .req .no { color: var(--foe); }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.item { background: var(--dune); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 8px; justify-items: start; }
.item .t { font-weight: 600; font-size: 13px; }
.item .s { font-size: 11px; color: var(--dust); }
.pt { display: inline-grid; place-items: center; border-radius: 50%; border: 2px solid var(--fc, var(--dust)); background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--fc, #888) 32%, #2c2016), #150e09 75%); overflow: hidden; flex: none; }
.pt svg { width: 100%; height: 100%; display: block; }
.ptw { position: relative; display: grid; place-items: center; }
.bubble { position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid rgb(111 179 234 / .8); background: radial-gradient(circle, transparent 58%, rgb(111 179 234 / .28)); animation: shimmer 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes shimmer { 50% { transform: scale(1.04); border-color: rgb(170 215 245 / .9); } }
.card .pt { width: 54px !important; height: 54px !important; }
.card.lunge.side-A { animation: lungeU .32s ease-out; } .card.lunge.side-B { animation: lungeD .32s ease-out; }
@keyframes lungeU { 40% { transform: translateY(-14px) scale(1.04); } } @keyframes lungeD { 40% { transform: translateY(14px) scale(1.04); } }
.wormart { width: min(340px, 90%); animation: sway 4s ease-in-out infinite; transform-origin: 20% 100%; }

const cosHtml = c => !c ? '' : [c.title ? `<span class="cosi t">Титул «${TITLES[c.title]}»</span>` : '', c.ava ? `<span class="cosi a">${avatarHtml('emb:' + c.ava, 'basic', 22)} Аватар «${EMBLEMS[c.ava].n}»</span>` : '', c.frame ? `<span class="cosi f">${avatarHtml(S.profile.ava, c.frame, 22)} Рамка «${FRAMES[c.frame].n}»</span>` : ''].join('');
function featClaim(id) {
  const F = FEATS.find(x => x.id === id); if (!F || !featReady(F)) return;
  const s = featStep(F), lines = giveRewards(featRw(F, s)), c = F.cos[s];
  if (c) { if (c.title) { S.unlocks.title[c.title] = 1; lines.push(`Титул «${TITLES[c.title]}»`); } if (c.ava) { S.unlocks.ava['emb:' + c.ava] = 1; lines.push(`Аватар «${EMBLEMS[c.ava].n}»`); } if (c.frame) { S.unlocks.frame[c.frame] = 1; lines.push(`Рамка «${FRAMES[c.frame].n}»`); } }
  S.feats[F.id] = s + 1; persist(); render();
  toast(`${F.n} ${ROMAN[s + 1]}: ` + lines.join(' · '));
}
function renderFeats() {
  const fv = v => v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace('.0', '') + ' млн' : v >= 1e4 ? Math.round(v / 1e3) + ' тыс.' : fmt(v);
  const cards = FEATS.map(F => {
    const s = featStep(F), v = METRIC[F.m](), max = F.at.length, done = s >= max, goal = done ? F.at[max - 1] : F.at[s], prev = s ? F.at[s - 1] : 0;
    const pct = done ? 100 : Math.max(0, Math.min(100, (v - prev) / (goal - prev) * 100)), ready = featReady(F);
    return `<div class="feat ${done ? 'done' : ''} ${ready ? 'ready' : ''}">
      <div class="fth"><div><h4>${F.n}</h4><span>${F.d}</span></div><span class="frank">${done ? 'Завершён' : `Ступень ${ROMAN[s + 1]} из ${max}`}</span></div>
      <div class="fpips">${F.at.map((a, k) => `<span class="fpip ${k < s ? 'got' : k === s && ready ? 'rdy' : ''}" title="${ROMAN[k + 1]}: ${fv(a)}${F.cos[k] ? ' · особая награда' : ''}">${ROMAN[k + 1]}${F.cos[k] ? '<i></i>' : ''}</span>`).join('')}</div>
      <div class="fbar"><i style="width:${pct}%"></i><b class="mono">${fv(Math.min(v, goal))} / ${fv(goal)}</b></div>
      ${done ? '<p class="sub" style="margin:0">Все ступени получены.</p>' : `<div class="frw"><span class="lbl">Награда ${ROMAN[s + 1]}</span>${rewardsHtml(featRw(F, s))}${cosHtml(F.cos[s])}</div>
      <div class="acts"><button class="btn ${ready ? 'go' : ''}" data-featclaim="${F.id}" ${ready ? '' : 'disabled'}>${ready ? 'Забрать' : 'В процессе'}</button></div>`}
    </div>`; }).join('');
  $('#view').innerHTML = `<h2 class="lshide">Подвиги</h2>
    <div class="fhead"><div><b class="mono">${featRank()} / ${featMax}</b><span>ступеней подвигов</span></div><div class="fbar big"><i style="width:${featRank() / featMax * 100}%"></i></div><p class="sub" style="margin:0">Каждый подвиг — лестница из ступеней. Чем выше, тем ценнее награда: Печати Ландсраада, Вода жизни, ридулиан, а на вершинах — титулы, аватары и рамки профиля (◆ на ступени).</p></div>
    <div class="feats">${cards}</div>`;
}

// ===================== profile =====================
function openProfile() {
  const P = S.profile;
  const heroAvas = ROSTER_IDS.map(id => 'hero:' + id), embAvas = Object.keys(EMBLEMS).map(k => 'emb:' + k);
  const howAva = a => { for (const F of FEATS) for (const [s, c] of Object.entries(F.cos)) if (c.ava && 'emb:' + c.ava === a) return `${F.n}, ступень ${ROMAN[+s + 1]}`; return 'Откройте героя'; };
  const howOf = (kind, id) => { for (const F of FEATS) for (const [s, c] of Object.entries(F.cos)) if (c[kind] === id) return `${F.n}, ступень ${ROMAN[+s + 1]}`; return ''; };
  const avaBtn = a => { const ok = unlocked('ava', a); return `<button class="pick ${P.ava === a ? 'on' : ''} ${ok ? '' : 'lk'}" data-pava="${a}" ${ok ? '' : 'disabled'} title="${ok ? '' : 'Как получить: ' + howAva(a)}">${avatarHtml(a, 'basic', 44)}</button>`; };
  const frBtn = f => { const ok = unlocked('frame', f); return `<button class="pick fr ${P.frame === f ? 'on' : ''} ${ok ? '' : 'lk'}" data-pframe="${f}" ${ok ? '' : 'disabled'} title="${FRAMES[f].n}${ok ? '' : ' — ' + howOf('frame', f)}">${avatarHtml(P.ava, f, 44)}<small>${FRAMES[f].n}</small></button>`; };
  const tBtn = k => { const ok = unlocked('title', k); return `<button class="ptitle ${P.title === k ? 'on' : ''} ${ok ? '' : 'lk'}" data-ptitle="${k}" ${ok ? '' : 'disabled'}><b>${TITLES[k]}</b><small>${ok ? (P.title === k ? 'выбран' : 'получен') : howOf('title', k) || 'особый режим'}</small></button>`; };
  const ownedT = Object.keys(TITLES).filter(k => unlocked('title', k)).length;
  $('#overlay2').innerHTML = `<div class="detail info-layer" data-iclose="1"><div class="sheet profsheet" role="dialog" aria-modal="true" aria-labelledby="prof-h">
    <div class="profcard">${avatarHtml(P.ava, P.frame, 84)}<div class="profmain"><span class="ptl">${TITLES[P.title] || ''}</span><h3 id="prof-h">${esc(P.nick)}</h3>
      <div class="profstats mono"><span>Мощь отряда ${fmt(squadPower())}</span><span>Героев ${unlockedIds().length}</span><span>Подвиги ${featRank()}/${featMax}</span><span>Побед ${fmt(S.stats.wins || 0)}</span></div></div></div>
    ${accPanel()}
    <p class="chap">Никнейм</p>
    <div class="nickrow"><input id="pnick" maxlength="20" value="${esc(P.nick)}" aria-label="Никнейм" autocomplete="off"><button class="btn go" data-pnick="1">Сохранить</button></div>
    <p class="chap">Аватар</p><div class="pgrid">${heroAvas.map(avaBtn).join('')}${embAvas.map(avaBtn).join('')}</div>
    <p class="chap">Рамка</p><div class="pgrid fr">${Object.keys(FRAMES).map(frBtn).join('')}</div>
    <p class="chap">Титул · получено ${ownedT} из ${Object.keys(TITLES).length}</p><div class="tgrid">${Object.keys(TITLES).map(tBtn).join('')}</div>
    <p class="chap">Сохранение</p>
    <p class="sub" style="margin:0 0 6px;font-size:12px">Прогресс хранится на этом устройстве. Сделайте резервную копию, чтобы перенести игру на другое устройство или не потерять её при очистке данных браузера.</p>
    <div class="acts" style="margin-top:0"><button class="btn" data-saveexp="1">Экспорт сохранения</button><button class="btn" data-saveimp="1">Импорт сохранения</button></div>
    <div class="acts"><button class="btn" data-v="feats" data-iclose2="1">Подвиги</button><button class="btn" data-iclose="1" style="margin-left:auto">Закрыть</button></div>
  </div></div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const profileChip = () => `<button class="pchip" data-profile="1" aria-label="Профиль игрока, уровень ${S.acc.lvl}"><span class="pchav">${avatarHtml(S.profile.ava, S.profile.frame, 40)}${accBadge()}</span><span><b>${esc(S.profile.nick)}</b><small>${TITLES[S.profile.title] || ''}</small></span></button>`;

// ===================== wiring =====================
function metaFill(s) {
  s.trials ??= {}; s.trialRuns ??= { d: '', n: {} }; s.squadTr ??= {}; s.trialSel ??= null;
  accFill(s);
  s.stats ??= {}; s.feats ??= {}; s.unlocks ??= { ava: {}, frame: {}, title: {} };
  s.profile ??= { nick: 'Странник', ava: 'hero:leto', frame: 'basic', title: 'novice' };
  if (s.stats.lastDay !== todayKey()) { s.stats.lastDay = todayKey(); s.stats.days = (s.stats.days || 0) + 1; }
  // special-mode titles
  if (s.raidKills && s.raidKills[2]) s.unlocks.title.raid3 = 1;
}
function metaClick(d) {
  if (d.trsel) { S.trialSel = d.trsel; persist(); render(); return true; }
  if (d.trgo) { closeInfo(true); if (BT && BT.done) leaveBattle(); trialGo(d.trgo); return true; }
  if (d.trsim) { trialSimClick(d.trsim); return true; }
  if (d.trmulti) { trialMulti(); return true; }
  if (d.featclaim) { featClaim(d.featclaim); return true; }
  if (d.profile) { openProfile(); return true; }
  if (d.pava) { if (unlocked('ava', d.pava)) { S.profile.ava = d.pava; persist(); render(); openProfile(); } return true; }
  if (d.pframe) { if (unlocked('frame', d.pframe)) { S.profile.frame = d.pframe; persist(); render(); openProfile(); } return true; }
  if (d.ptitle) { if (unlocked('title', d.ptitle)) { S.profile.title = d.ptitle; persist(); render(); openProfile(); } return true; }
  if (d.pnick) { const v = ($('#pnick').value || '').trim().slice(0, 20); if (v) { S.profile.nick = v; persist(); render(); openProfile(); toast('Никнейм сохранён'); } return true; }
  if (d.saveexp) { const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $('#overlay2').innerHTML = `<div class="detail info-layer" data-iclose="1"><div class="sheet infosheet" role="dialog" aria-modal="true"><h3>Экспорт сохранения</h3><p class="sub">Скопируйте код и сохраните его в Заметках или отправьте себе. Импорт на другом устройстве восстановит весь прогресс.</p><textarea id="savecode" class="savebox" readonly>${code}</textarea><div class="acts"><button class="btn go" data-savecopy="1">Скопировать</button><button class="btn" data-iclose="1" style="margin-left:auto">Закрыть</button></div></div></div>`; return true; }
  if (d.savecopy) { const t = $('#savecode'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Код скопирован'), () => { try { document.execCommand('copy'); toast('Код скопирован'); } catch (e) { toast('Выделите и скопируйте вручную'); } }); return true; }
  if (d.saveimp) { $('#overlay2').innerHTML = `<div class="detail info-layer" data-iclose="1"><div class="sheet infosheet" role="dialog" aria-modal="true"><h3>Импорт сохранения</h3><p class="sub">Вставьте код экспорта. Текущий прогресс на этом устройстве будет заменён.</p><textarea id="savecode" class="savebox" placeholder="Вставьте код сюда"></textarea><div class="acts"><button class="btn go" data-saveload="1">Загрузить</button><button class="btn" data-iclose="1" style="margin-left:auto">Отмена</button></div></div></div>`; return true; }
  if (d.saveload) { try { const s = JSON.parse(decodeURIComponent(escape(atob(($('#savecode').value || '').trim())))); if (!s || !s.roster) throw 0; S = fillSave(s); metaFill(S); persist(); closeInfo(true); view = 'lobby'; render(); toast('Сохранение загружено'); } catch (e) { toast('Код не распознан'); } return true; }
  if (d.iclose2 && d.v) { closeInfo(true); view = d.v; render(); return true; }
  return false;
}
SPOT_ICONS.trial = '<path d="M12 2l3 6 6 1-4.5 4.3 1 6.2L12 16.6 6.5 19.5l1-6.2L3 9l6-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
SPOT_ICONS.feat = '<path d="M7 3h10v4a5 5 0 01-10 0z" fill="currentColor"/><path d="M7 5H4a3 3 0 003 4M17 5h3a3 3 0 01-3 4M12 12v4M8 20h8M10 16h4v4h-4z" fill="none" stroke="currentColor" stroke-width="1.8"/>';

// ===================== account level =====================
const ACC_MAX = 40;
const accNeed = L => 20 + 20 * (L - 1);                 // XP from L to L+1
const GEAR_CAP_AT = { 2: 5, 3: 12, 4: 20, 5: 28 };     // gear tier -> account level
const heroCap = () => Math.min(MAX_LVL, S.acc.lvl);
const gearCap = () => Object.entries(GEAR_CAP_AT).reduce((m, [t, l]) => S.acc.lvl >= l ? Math.max(m, +t) : m, 1);
const accReward = L => [['cry', 15 + 5 * L], ['water', 60], ...(L % 5 === 0 ? [['folio', 5], ['seal', 1]] : [])];
function accXP(n) {
  if (!n || S.acc.lvl >= ACC_MAX) return [];
  S.acc.xp += Math.round(n); const out = [];
  while (S.acc.lvl < ACC_MAX && S.acc.xp >= accNeed(S.acc.lvl)) {
    S.acc.xp -= accNeed(S.acc.lvl); S.acc.lvl++;
    const L = S.acc.lvl, got = giveRewards(accReward(L)), un = [];
    if (L <= MAX_LVL) un.push(`героев можно качать до ур. ${L}`);
    for (const [t, l] of Object.entries(GEAR_CAP_AT)) if (l === L) un.push(`открыто снаряжение ${ROMAN[t]}`);
    out.push(`<b class="acclv">Уровень аккаунта ${L}!</b> ${got.join(' ')}${un.length ? ` · ${un.join(', ')}` : ''}`);
  }
  if (S.acc.lvl >= ACC_MAX) S.acc.xp = 0;
  return out;
}
function accFill(s) {
  if (s.acc) return;
  const maxLvl = Math.max(1, ...Object.values(s.roster).map(r => r.lvl || 1)), maxGear = Math.max(1, ...Object.values(s.roster).map(r => r.gear || 1));
  s.acc = { lvl: Math.min(ACC_MAX, Math.max(maxLvl, GEAR_CAP_AT[maxGear] || 1)), xp: 0 };
}
const accBadge = () => `<span class="accb" title="Уровень аккаунта ${S.acc.lvl}" style="--p:${S.acc.lvl >= ACC_MAX ? 100 : Math.round(S.acc.xp / accNeed(S.acc.lvl) * 100)}%"><b>${S.acc.lvl}</b></span>`;
function accPanel() {
  const L = S.acc.lvl, max = L >= ACC_MAX, need = accNeed(L), pct = max ? 100 : S.acc.xp / need * 100;
  const nextG = Object.entries(GEAR_CAP_AT).find(([t, l]) => l > L);
  return `<div class="accp"><div class="accrow"><span class="acclvl">${L}</span><div style="flex:1;min-width:0"><b>Уровень аккаунта</b><div class="fbar"><i style="width:${pct}%"></i><b class="mono">${max ? 'максимум' : `${fmt(S.acc.xp)} / ${fmt(need)} опыта`}</b></div></div></div>
    <div class="acckv"><span>Потолок уровня героев</span><b>${heroCap()}</b><span>Потолок снаряжения</span><b>${ROMAN[gearCap()]}</b>${nextG ? `<span>Снаряжение ${ROMAN[nextG[0]]}</span><b>с ур. ${nextG[1]}</b>` : ''}<span>Награда за ур. ${Math.min(ACC_MAX, L + 1)}</span><b>${rewardsHtml(accReward(Math.min(ACC_MAX, L + 1)))}</b></div>
    <p class="sub" style="margin:4px 0 0;font-size:11px">Опыт: 3 за каждую единицу Воды или Свечей в победе и симуляции, 15 за победу в испытании, 40 в путешествии легенды, 30 за атаку в рейде, 10 за дневное задание.</p></div>`;
}

// ===================== effect names highlighted in descriptions =====================
const FX_RX = /(Яд|Страх|Оглушени|Брон[яюи]↓|Голос(?![а-яё])|Провокаци|Скрытност|Защит[аыу]↑|Контратак|Уклонени[еяю]↑)[а-яё]*/g;
const FX_BAD_RX = /^(Яд|Страх|Оглуш|Брон|Голос)/;
const fxText = s => String(s).replace(FX_RX, m => `<span class="fxw ${FX_BAD_RX.test(m) ? 'bad' : 'good'}">${m}</span>`);

window.claude?.hot?.snapshot?.(() => ({ save: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

// long press on a unit in battle → unit sheet
(() => {
  let tm = null, sx = 0, sy = 0, t0 = 0, uidLP = null;
  const cancel = () => { clearTimeout(tm); tm = null; };
  const fire = () => { cancel(); if (!BT || $('#bpop')) return; BT.lpFired = true; setTimeout(() => { if (BT) BT.lpFired = false; }, 700); if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} openUnitPop(uidLP); };
  document.addEventListener('pointerdown', e => {
    if (!BT || $('#bpop')) return; const un = e.target.closest('#battle .unit'); if (!un || e.target.closest('[data-fxu]')) return;
    sx = e.clientX; sy = e.clientY; t0 = performance.now(); uidLP = un.dataset.uid; cancel();
    tm = setTimeout(fire, 480);
  });
  document.addEventListener('pointermove', e => { if (tm && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
  document.addEventListener('pointerup', () => { if (tm && performance.now() - t0 >= 460) fire(); else cancel(); }); document.addEventListener('pointercancel', cancel);
  document.addEventListener('contextmenu', e => { const un = BT && e.target.closest('#battle .unit'); if (!un) return; e.preventDefault(); cancel(); if (!$('#bpop')) openUnitPop(un.dataset.uid); });
})();
</script>
