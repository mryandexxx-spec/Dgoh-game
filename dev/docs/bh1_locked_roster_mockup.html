<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BH1: закрытые Марго и Юэ · согласование ростера</title><style>
:root{--bg:#12191e;--pane:#22252a;--edge:#705b42;--text:#e6d3ae;--sub:#a89b86;--accent:#d6a66b}
*{box-sizing:border-box}body{margin:0;background:#101217;color:var(--text);font:12px system-ui,-apple-system,sans-serif}
main{padding:16px;display:grid;gap:14px;justify-content:center}h1{font-size:17px;margin:0 0 6px}h2{font-size:12px;color:var(--accent);margin:0 0 6px}
p{margin:0 0 8px;color:var(--sub)}.screen{border:1px solid var(--edge);border-radius:12px;background:linear-gradient(160deg,#242930,#151a20);overflow:hidden;padding:10px;display:flex;flex-direction:column;gap:8px}.large{width:844px;height:390px}.small{width:667px;height:375px}
.top{display:flex;align-items:center;justify-content:space-between}.buttons{display:flex;gap:8px}.chip{border:1px solid var(--edge);background:#342e2a;padding:6px 10px;border-radius:6px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;overflow:hidden}.unit{text-align:center;min-width:0}.face{position:relative;aspect-ratio:1;border-radius:50%;border:3px solid #63503e;background:radial-gradient(circle at 40% 30%,#766551,#363239 65%,#181b23);display:grid;place-items:center;font-size:31px}.face:after{content:"🔒";position:absolute;bottom:0;right:-3px;font-size:16px;background:#28242a;border-radius:50%;padding:3px}.unit .nm{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;color:#b9b2a8}.shards{height:7px;background:#11151c;border:1px solid #5b5348;border-radius:3px;margin-top:4px;position:relative}.shards span{position:absolute;left:0;right:0;top:7px;color:#b3a28f;font-size:9px}
.note{border-top:1px solid #5b5348;padding-top:6px;color:#aaa091;font-size:10px}.small .grid{gap:6px}.small .face{font-size:25px}.small .chip{padding:5px}.small .unit .nm{font-size:9px}
</style></head><body><main><div><h1>BH1 · Ростер: Марго и Юэ</h1><p>Статический макет. Портреты показаны условными силуэтами; способности, фракции и источники осколков не утверждены.</p></div><div id="root"></div></main><script>
const cards=[['Барон','♟'],['Фейд-Раута','♞'],['Мохиам','♝'],['Шаддам IV','♛'],['Питер','♜'],['Марго Фенринг','♙'],['Доктор Юэ','♙']];
for(const [width,height] of [[844,390],[667,375]]){const section=document.createElement('section');section.innerHTML='<h2>'+width+' × '+height+'</h2>';const el=document.createElement('div');el.className='screen '+(width===844?'large':'small');el.innerHTML='<div class="top"><strong>ПЕРСОНАЖИ</strong><div class="buttons"><span class="chip">Фракция: все</span><span class="chip">Сорт.: мощь</span></div></div><p>Закрытые персонажи · условный фрагмент существующей сетки</p><div class="grid">'+cards.map(([name,icon],i)=>'<div class="unit"><div class="face">'+icon+'</div><div class="nm">'+name+'</div><div class="shards"><span>0 / '+(i<5?'50':'?')+'</span></div></div>').join('')+'</div><div class="note">Марго и Юэ · закрыты до отдельного события · источников осколков пока нет. После открытия — обычные играбельные персонажи с собственной прокачкой.</div>';section.appendChild(el);document.getElementById('root').appendChild(section)}
</script></body></html>
