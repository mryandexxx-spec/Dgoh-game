<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE1 — Gear mockups</title><style>
/* Арракис: затенённая скала, освещённый песчаник и медь пряности. */
:root {
  --night: #26231f;
  --dune: #38312a;
  --ridge: #4b4034;
  --line: #75634e;
  --line-hi: #a18b6b;
  --limestone: #edcf9e;
  --ochre: #c49a66;
  --ink: #30291f;
  --bone: #fff1d6;
  --dust: #deceb1;
  --spice: #f2a46d;
}
*{box-sizing:border-box}
body{font:13px Arial;background:var(--night);color:var(--bone);margin:18px}
h1{font:28px Georgia}
h2{font:18px Georgia;color:var(--limestone);margin:25px 0 10px}
.screen{background:var(--dune);border:2px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.screen.w{width:844px;height:390px}
.screen.s{width:667px;height:375px}
.crumb{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head{color:var(--ink);display:flex;align-items:center;gap:12px;margin:9px 0}
.icon{color:var(--bone);width:52px;height:52px;background:#45254e;border:3px solid #b04ee8;border-radius:9px;display:grid;place-items:center;font-size:30px}
.name{font:24px Georgia}
.sub{color:#532551;font-size:12px}
.columns{display:grid;grid-template-columns:46% 52%;gap:2%;height:235px}
.col{overflow:auto}
.t{color:var(--spice);letter-spacing:1.5px;border-bottom:1px solid var(--line-hi);padding:3px;margin-bottom:6px}
.line,.node{border:1px solid var(--line);border-radius:4px;padding:7px;margin:6px 0;background:var(--ridge)}
.line{display:flex;justify-content:space-between}
.line b{color:var(--spice)}
.node strong{display:block}
.node small{color:var(--dust)}
button{background:var(--dune);color:var(--bone);border:1px solid var(--line-hi);padding:6px 11px;border-radius:4px;margin:3px;font-weight:bold}
button.go{background:var(--spice);color:var(--ink)}
.hint{font-size:11px;color:var(--dust)}
.s .name{font-size:20px}
.s .line,.s .node{padding:5px}
.s button{padding:5px}
.s .head{margin:5px 0}
.s .columns{height:229px}

.summary{display:flow-root;margin:-12px -12px 0;padding:12px 12px 0;background:linear-gradient(108deg,var(--limestone),var(--ochre))}
</style>
<h1>GE1 · Источники снаряжения</h1><p>Макеты на согласование. Названия точек условны: реальные источники назначает детерминированная таблица, общая с выдачей наград.</p>
<script>const screens=[["w","Предмет",false],["w","Компонент",true],["s","Предмет",false],["s","Компонент",true]];for(const [size,label,part] of screens){document.write('<h2>'+label+' · '+(size==="w"?"844×390":"667×375")+'</h2><div class="screen '+size+'"><div class="summary"><div class="crumb">‹ Дункан › '+(part?'Планшет ментата IX › Сердечник':'Снаряжение')+'</div><div class="head"><div class="icon">'+(part?'⬡':'▤')+'</div><div><div class="name">'+(part?'Сердечник планшета IX':'Планшет ментата мк. IX')+'</div><div class="sub">ЭПИЧЕСКИЙ · УРОВЕНЬ IX · '+(part?'КОМПОНЕНТ':'ЯЧЕЙКА 4')+'</div></div></div></div><div class="columns"><div class="col"><div class="t">РЕЦЕПТ</div>'+(part?'<div class="line">Фрагменты сердечника <b>1/6</b></div><p class="hint">Старые универсальные фрагменты: 1 — применяются при сборке до исчерпания.</p>':'<div class="line">Сердечник <b>0/1 ›</b></div><div class="line">Линза <b>0/1 ›</b></div>')+'<p class="hint">Сборка · солярии и пласталь</p><button>'+(part?'Создать компонент':'Создать и надеть')+'</button><button>Найти</button></div><div class="col"><div class="t">'+(part?'ФРАГМЕНТЫ СЕРДЕЧНИКА':'ГОТОВЫЙ ПРЕДМЕТ · РЕДКАЯ НАХОДКА')+'</div>'+(part?'<div class="node"><strong>Светлые VI-8</strong><small>Только фрагменты сердечника</small><button class="go">В бой</button></div><div class="node"><strong>Тёмные VII-2</strong><small>Только фрагменты сердечника</small><button class="go">В бой</button></div><p class="hint">Линза добывается в других миссиях.</p>':'<div class="node"><strong>Светлые VII-7 · шанс 0,2%</strong><small>При выпадении целый предмет сразу доступен для установки</small><button class="go">В бой</button></div><p class="hint">Обычный путь: собрать из двух компонентов. Источники фрагментов доступны внутри каждого компонента.</p>')+'</div></div></div>')}</script></html>
