<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE1 — Gear mockups</title><style>
:root{--bg:#231810;--ink:#f4e7cf;--soft:#bca685;--line:#6a4c30;--hot:#e8913f;--purple:#b04ee8}*{box-sizing:border-box}body{font:13px Arial;background:#140d09;color:var(--ink);margin:18px}h1{font:28px Georgia}h2{font:18px Georgia;color:#e8c98e;margin:25px 0 10px}.screen{background:radial-gradient(at 50% 0,#3b281b,var(--bg) 80%);border:2px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}.screen.w{width:844px;height:390px}.screen.s{width:667px;height:375px}.crumb{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head{display:flex;align-items:center;gap:12px;margin:9px 0}.icon{width:52px;height:52px;background:#45254e;border:3px solid var(--purple);border-radius:9px;display:grid;place-items:center;font-size:30px}.name{font:24px Georgia}.sub{color:var(--purple);font-size:12px}.columns{display:grid;grid-template-columns:46% 52%;gap:2%;height:235px}.col{overflow:auto}.t{color:var(--hot);letter-spacing:1.5px;border-bottom:1px solid #70462c;padding:3px;margin-bottom:6px}.line,.node{border:1px solid #664932;border-radius:4px;padding:7px;margin:6px 0;background:#302117}.line{display:flex;justify-content:space-between}.line b{color:var(--hot)}.node strong{display:block}.node small{color:var(--soft)}button{background:#3b291d;color:var(--ink);border:1px solid #856044;padding:6px 11px;border-radius:4px;margin:3px;font-weight:bold}button.go{background:#db8a3f;color:#281508}.hint{font-size:11px;color:var(--soft)}.s .name{font-size:20px}.s .line,.s .node{padding:5px}.s button{padding:5px}.s .head{margin:5px 0}.s .columns{height:229px}</style>
<h1>GE1 · Источники снаряжения</h1><p>Макеты на согласование. Названия точек условны: реальные источники назначает детерминированная таблица, общая с выдачей наград.</p>
<script>const screens=[["w","Предмет",false],["w","Компонент",true],["s","Предмет",false],["s","Компонент",true]];for(const [size,label,part] of screens){document.write('<h2>'+label+' · '+(size==="w"?"844×390":"667×375")+'</h2><div class="screen '+size+'"><div class="crumb">‹ Дункан › '+(part?'Планшет ментата IX › Сердечник':'Снаряжение')+'</div><div class="head"><div class="icon">'+(part?'⬡':'▤')+'</div><div><div class="name">'+(part?'Сердечник планшета IX':'Планшет ментата мк. IX')+'</div><div class="sub">ЭПИЧЕСКИЙ · УРОВЕНЬ IX · '+(part?'КОМПОНЕНТ':'ЯЧЕЙКА 4')+'</div></div></div><div class="columns"><div class="col"><div class="t">РЕЦЕПТ</div>'+(part?'<div class="line">Фрагменты сердечника <b>1/6</b></div><p class="hint">Старые универсальные фрагменты: 1 — применяются при сборке до исчерпания.</p>':'<div class="line">Сердечник <b>0/1 ›</b></div><div class="line">Линза <b>0/1 ›</b></div>')+'<p class="hint">Сборка · солярии и пласталь</p><button>'+(part?'Создать компонент':'Создать и надеть')+'</button><button>Найти</button></div><div class="col"><div class="t">'+(part?'ФРАГМЕНТЫ СЕРДЕЧНИКА':'ГОТОВЫЙ ПРЕДМЕТ · РЕДКАЯ НАХОДКА')+'</div>'+(part?'<div class="node"><strong>Светлые VI-8</strong><small>Только фрагменты сердечника</small><button class="go">В бой</button></div><div class="node"><strong>Тёмные VII-2</strong><small>Только фрагменты сердечника</small><button class="go">В бой</button></div><p class="hint">Линза добывается в других миссиях.</p>':'<div class="node"><strong>Светлые VII-7 · шанс 0,2%</strong><small>При выпадении целый предмет сразу доступен для установки</small><button class="go">В бой</button></div><p class="hint">Обычный путь: собрать из двух компонентов. Источники фрагментов доступны внутри каждого компонента.</p>')+'</div></div></div>')}</script></html>
