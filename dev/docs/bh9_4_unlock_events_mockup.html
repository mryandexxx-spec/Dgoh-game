<style>

</style></head><body><main><h1>BH9.4 · События получения Марго и Юэ</h1><p>Статический HTML-макет 844×390 и 667×375. Сюжетные составы, противники и экономика являются предложениями и ещё не действуют в игре. Использует общий стиль без новой карточки героя.</p><div id="screens"></div><script>
const events=[
{title:'ШЁЛКОВЫЕ НИТИ',name:'Леди Марго Фенринг',letter:'М',stage:['Приём при дворе','Шёпот Бене Гессерит','Нити судьбы'],foes:'Фенринг · Шаддам · Питер · Сардаукар',tone:'Интрига и дипломатия'},
{title:'ЦЕНА КЛЯТВЫ',name:'Доктор Веллингтон Юэ',letter:'Ю',stage:['Врачебный долг','Нарушенная печать','Цена решения'],foes:'Барон · Питер · Фейд · Раббан',tone:'Выбор и врачебный долг'}

const label=document.createElement('h2');label.textContent=e.title+' · '+w+'×'+h;host.appendChild(label);
const frame=document.createElement('div');frame.className='frame '+(w===844?'wide':'small');
frame.innerHTML='<div class="top"><span>‹ СОБЫТИЯ</span><strong>'+e.title+'</strong><span>0/3 · ПРОЕКТ</span></div><div class="cols"><div class="panel"><div class="hero">'+e.letter+'</div><h3 style="margin-top:7px">'+e.name+'</h3><div class="muted">'+e.tone+' · отдельный герой</div><div class="progress"><i></i></div><div class="muted">Осколки: 0 / 330 (модель экономики)</div></div><div class="panel"><h3>ТРИ СЮЖЕТНЫХ БОЯ</h3>'+e.stage.map((x,i)=>'<div class="stage '+(i===2?'sel':'')+'"><b>0'+(i+1)+'</b><span>'+x+'<small>'+(i===0?'Знакомство и первая победа':i===1?'Раскрытие конфликта':'Финал · повторы после победы')+'</small></span></div>').join('')+'<div class="pair"><span class="token">Выбор 5 героев</span><span class="token">Без легенды Барона</span></div></div><div class="panel"><h3>III · ПРЕДЛАГАЕМЫЙ БОЙ</h3><div class="muted">Противники: '+e.foes+'</div><div class="warning">Награды и условия ожидают согласования. Предложено: 20/30/50 осколков однократно, далее 2 за победу — максимум 5 побед в день.</div><div class="pill disabled">НАЧАТЬ · ПОКА ЗАКРЫТО</div></div></div>';
host.appendChild(frame);
}
</script></main></body></html>
