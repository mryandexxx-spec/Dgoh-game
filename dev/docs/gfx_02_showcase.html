const statline='<div class="statsline">Здоровье · 32 400<br>Защита · 24 500<br>Скорость · 162</div>';
const left=v==='a'?identity:v==='b'?identity+'<div class="line"></div>'+readout:identity+'<div class="line"></div>'+readout;
const tabs=`<div class="tabs">${[['overview','Обзор'],['skills','Умения'],['gear','Снаряжение'],['memory','ДП']].map(([t,l])=>`<button data-act="tab:${t}" aria-pressed="${tab===t}">${l}</button>`).join('')}</div>`;
const cpanel=tab==='overview'?`<div class="paneltitle">Развитие</div>${locked?other:statline+btn('find','Источники осколков','primary')}<div class="line"></div><div class="panelcopy">Умения и снаряжение — отдельные быстрые вкладки.</div>`:tab==='skills'?skills:tab==='gear'?gear:`<div class="paneltitle">Другая память</div><p class="panelcopy">${locked?'Сначала откройте героя.':mem?'Уровень '+s.mem+' из 7':'Условия: 7 звёзд, снаряжение XIII.'}</p>${btn('memory','Подробнее','primary',locked)}`;
const right=v==='a'?readout+'<div class="line"></div>'+ult+skills+gear+other:v==='b'?ult+skills+'<div class="line"></div>'+gear+other:ult+`<div class="panelbody">${cpanel}</div>`;
F.innerHTML=`<div class="art" style="background-image:url('data:image/webp;base64,${ART[key]}')"></div><header class="header">${btn('back','‹','back',false,'Назад')}<span class="crumb">Герой</span><span class="world">${h.world} · ${fmt(s.sol)} сол.</span>${btn('find','Осколки')}${btn('stats','Статы')}${btn('bio','Био')}${btn('close','×','close',false,'Закрыть')}</header><section class="leftzone">${left}</section><section class="rightzone">${right}</section><footer class="footer">${btn('prev','‹','nav',false,'Предыдущий герой')}${v==='c'?tabs:'<span class="sceneinfo">'+h.world+' · AI concept</span>'}${primary}${btn('next','›','nav',false,'Следующий герой')}</footer><div class="toast" id="toast" role="status"></div><div id="modal" class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><h2 id="dlg-title"></h2><p id="dlg-text"></p><div id="dlg-extra"></div><div id="dlg-actions" class="buttons"></div></div></div>`;
}
function dialog(t,x,confirm,label='Подтвердить',extra=''){lastFocus=document.activeElement;$('dlg-title').textContent=t;$('dlg-text').textContent=x;$('dlg-extra').innerHTML=extra;$('dlg-actions').innerHTML=(confirm?`<button id="confirm" class="primary">${label}</button>`:'')+'<button id="cancel">Закрыть</button>';$('modal').hidden=false;$('cancel').onclick=close;if(confirm)$('confirm').onclick=()=>{confirm();render();$('toast').textContent='Действие выполнено в макете';F.querySelector('[data-act="stats"]').focus()};$('cancel').focus();}
function close(){$('modal').hidden=true;lastFocus?.focus()}
F.onclick=e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;const s=get(),h=heroes[$('hero').value],st=$('state').value,locked=st==='locked'&&!s.unlocked;if(a.startsWith('tab:')){tab=a.split(':')[1];return render()}if(a==='prev'||a==='next'){$('hero').selectedIndex=1-$('hero').selectedIndex;return render()}if(a==='stats')return dialog('Характеристики','Здоровье 32 400 · Защита 24 500 · Скорость 162 · Урон 4 120. Тестовые данные.');if(a==='bio')return dialog(h.name,h.world+' · '+h.faction+' · '+h.role+'. Биографическая справка (макет).');if(a==='back'||a==='close')return dialog('Возврат в ростер','В игре здесь выполняется штатная навигация.');if(a==='find')return dialog('Источники осколков','Кампания / магазин — тестовый переход.',()=>s.shards+=20,'Получить 20 (тест)');if(a==='unlock')return dialog('Призвать','80 тестовых осколков',()=>{s.shards-=80;s.unlocked=true;s.stars=1});if(a==='level')return dialog('Повышение уровня','Выберите целевой уровень. Стоимость условная.',()=>s.lvl=+$('level').value,'Повысить',`<label>Уровень ${s.lvl} → <output id="target">85</output><input id="level" aria-label="Целевой уровень" type="range" min="${s.lvl+1}" max="85" value="85" oninput="document.getElementById('target').value=this.value"></label>`);if(a==='star')return dialog('Повышение звезды','65 тестовых осколков',()=>{s.shards-=65;s.stars++});if(a==='memory')return dialog('Другая память',st==='memory'?'Усиление до '+Math.min(7,s.mem+1):'Условия: 7★ и снаряжение XIII.',st==='memory'&&s.mem<7?()=>s.mem++:null);if(a==='ulta')return dialog('Ультимативная способность',s.ulta?'Уже открыта':'Открытие ульты (тест)',!s.ulta&&!locked?()=>s.ulta=true:null);if(a==='all')return dialog('Надеть всё','Доступные тестовые предметы будут надеты.',()=>s.eq=s.eq.map(x=>x===0||x===2?1:x));if(a==='tier')return dialog('Снаряжение',s.gear===13?'Условия пробуждения ДП':'Повысить тир',s.gear<13?()=>{s.gear++;s.eq=[0,0,2,0,3,3]}:null);if(a.startsWith('slot')){let i=+a.slice(4),x=s.eq[i];return dialog('Предмет '+(i+1),['Готов к надеванию','Уже надет','Можно создать','Не хватает компонентов'][x],x===0||x===2?()=>s.eq[i]=1:null)}if(a.startsWith('skill')){let i=+a.slice(5);return dialog(h.skills[i][1],'Уровень '+s.skills[i]+' / 8 · описание и стоимость (тест)',!locked&&s.skills[i]<8?()=>s.skills[i]++:null)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)close();if(e.key==='Tab'&&!$('modal').hidden){let b=[...$('modal').querySelectorAll('button,input')],i=b.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&i===b.length-1){e.preventDefault();b[0].focus()}}});['variant','hero','state','size'].forEach(id=>$(id).onchange=()=>{tab='overview';render()});$('reset').onclick=()=>{progress={};tab='overview';render()};render();
</script></body></html>
