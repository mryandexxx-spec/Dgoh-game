lumns:228px minmax(0,1fr) 166px}.b.compact{grid-template-columns:194px minmax(0,1fr) 146px}.b .left{border-left:3px solid var(--accent);margin-left:8px;padding-left:10px}.b .stage svg{transform:translateX(-41%)}.b .gear{position:static;display:grid;grid-template-columns:repeat(3,44px);justify-content:start;gap:4px;margin:5px 0 10px;pointer-events:auto}.b .gear>div{display:contents}.b .stage svg{height:100%}.b .right .scroll h2{margin-top:2px}.c{grid-template-columns:148px minmax(0,1fr) 164px}.c.compact{grid-template-columns:135px minmax(0,1fr) 140px}.c .shade{background:linear-gradient(90deg,#071013ef,transparent 39%,transparent 64%,#071013e8),linear-gradient(0deg,#080d10f5,transparent 28%,transparent 80%,#080d10db)}.c .stage svg{height:100%;max-width:100%}.c .gear{inset:auto 0 17px;justify-content:center;gap:4px}.c .gear>div{flex-direction:row;gap:4px}.c .stage svg{height:calc(100% - 60px);top:0}.c .shadow{bottom:19%}.c .caption{bottom:2px}.c .gear .slot{background:#152025ce}.c .skill b{font-size:11px}.c .skill .glyph{width:31px;height:31px}.c .group{padding:7px}.modal{position:absolute;inset:0;z-index:9;background:#060a0bdc;display:grid;place-items:center}.modal[hidden]{display:none}.dialog{width:min(370px,90%);max-height:90%;overflow:auto;background:#172126;border:1px solid #81918f;padding:15px;border-radius:5px;box-shadow:0 12px 50px #000}.dialog h2{font-size:18px;margin:0 0 8px}.dialog button{margin-top:12px}.toast{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);background:#1f3027;padding:8px 14px;z-index:8;border:1px solid #8fae97;max-width:70%;text-align:center}.toast:empty{display:none}@media(max-width:850px){.viewport{justify-items:start}.frame{margin-left:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}} </style></head><body>
<div class="lab"><b>GFX-02 / Cinematic Dune</b><label>Композиция <select id="variant"><option value="a">A · Cinematic Minimalism</option><option value="b">B · Imperial Dossier</option><option value="c">C · Immersive 3D</option></select></label><label>Герой <select id="hero"><option value="atr">Дункан</option><option value="hark">Молодой Барон</option></select></label><label>Состояние <select id="state"><option value="normal">Обычный</option><option value="locked">Закрытый</option><option value="memory">ДП</option><option value="legend">Легенда (тест)</option></select></label><label>Экран <select id="size"><option>844×390</option><option>667×375</option></select></label><button id="reset">Сброс</button></div><p class="note">Рабочий HTML-прототип · тестовые числа и названия действий · сцена и силуэт — заглушки, не Babylon. Фоны UI-10 подгружаются из публичного GitHub при наличии сети; офлайн — локальный эскиз. На узком экране поверните телефон горизонтально; сам игровой кадр не прокручивается.</p><div class="viewport"><main class="frame" id="frame" aria-label="Карточка персонажа"></main></div>
<script>
const $=id=>document.getElementById(id), F=$('frame');let progress={},lastFocus=null;const heroes={atr:{name:'Дункан Айдахо',world:'Каладан',faction:'Атрейдесы · Свет · Танк · Мастер меча',skills:['Удар клинком','Мастер меча','Защита Атрейдесов','Верность Дому','Стойкость'],color:'#526966'},hark:{name:'Молодой Барон Владимир',world:'Гьеди Прайм',faction:'Харконнены · Тьма · Поддержка',skills:['Приказ Барона','Жестокий расчёт','Интрига','Власть Харконненов','Стальная воля'],color:'#48494f'}};
function get(){let key=$('hero').value+':'+$('state').value;return progress[key]??=( {lvl:72,stars:5,shards:65,gear:9,eq:[1,0,2,1,0,3],mem:3,skills:[5,6,4,5,3],ulta:false,sol:2846000});}
function figure(h){return `<svg viewBox="0 0 180 300" role="img" aria-label="Условный силуэт ${h.name}"><defs><linearGradient id="armor" x2="1" y2="1"><stop stop-color="${h.color}"/><stop offset=".48" stop-color="#313a40"/><stop offset="1" stop-color="#12181d"/></linearGradient><linearGradient id="skin"><stop stop-color="#d8bda4"/><stop offset="1" stop-color="#77665f"/></linearGradient></defs><path d="M57 86 42 121 39 214 25 281 65 279 84 202 98 202 115 280 151 281 139 212 137 122 121 87Z" fill="#222c30" stroke="#8d9695" stroke-width="1"/><path d="M59 81 38 98 24 153 38 188 54 182 50 143 63 126 66 186 116 186 117 123 130 147 125 180 142 184 157 153 143 100 119 81Z" fill="url(#armor)" stroke="#9ba4a1" stroke-opacity=".55"/><path d="M67 86 89 111 114 86 116 162 91 181 66 162Z" fill="#222b31" stroke="#8d9d9a"/><path d="M72 121 108 121M73 132 108 132M66 165 116 165" stroke="#9ba4a1" stroke-opacity=".6" stroke-width="2"/><path d="M69 48Q65 20 91 18Q117 20 114 50L108 71 96 82 83 81 72 69Z" fill="url(#skin)" stroke="#a6a29c"/><path d="M68 48 68 28 78 17 98 15 114 23 117 45 107 38 100 30 80 34Z" fill="#27282a"/><path d="M77 52 85 50M98 50 106 52M87 69 99 69" stroke="#423b37" stroke-width="2"/><path d="M65 187 83 205 65 267 48 267 52 222ZM98 205 116 187 132 222 136 267 116 267Z" fill="url(#armor)" stroke="#697678"/><path d="M44 266 67 266 68 282 39 282ZM115 266 138 266 145 282 113 282Z" fill="#151c20"/>${$('hero').value==='atr'?'<path d="M139 177 147 179 172 271 164 274Z" fill="#b2c4ca" stroke="#182126"/><path d="M133 178 153 172" stroke="#bda47c" stroke-width="5"/>':'<path d="M57 92 48 202 33 270 68 251 78 140M122 92 133 201 147 270 111 252 102 140" fill="#34353a" stroke="#74777a"/>'}</svg>`}
function button(action,label,cls='',disabled=false){return `<button data-act="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`}function render(){let h=heroes[$('hero').value],s=get(),st=$('state').value,locked=st==='locked'&&!s.unlocked,mem=st==='memory',legend=st==='legend',v=$('variant').value;F.className='frame '+$('hero').value+' '+v+($('size').selectedIndex?' compact':'')+(locked?' locked':'');let skillRows=h.skills.map((n,i)=>button('skill'+i,`<span class="glyph">${['╱','✦','⬡','◇','✧'][i]}</span><span><b>${n}</b><small>Ур. ${s.skills[i]} · ${i===0?'базовая':i===3?'лидерская':'особая'}</small></span>${!locked&&s.skills[i]<8?'<span class="up">▲</span>':''}`,'skill')).join('');let slot=i=>button('slot'+i,`<b>${['⬡','╱','◈','⛨','✚','▥'][i]}</b><small>${['Надеть','✓','Создать','Найти'][s.eq[i]]}</small>`,'slot '+(s.eq[i]===0?'ready':s.eq[i]===3?'part':''));let count=s.eq.filter(x=>x===1).length;let gear=!locked&&!mem?`<div class="gear"><div>${[0,1,2].map(slot).join('')}</div><div>${[3,4,5].map(slot).join('')}</div></div>`:'';F.innerHTML=`<div class="scenery"><div class="plate" style="background-image:url('https://raw.githubusercontent.com/mryandexxx-spec/Dgoh-game/cc141e1742c25b8cd7314867d41c36cf4de8156a/dev/assets/img/hero-factions/${$('hero').value}.webp')"></div><div class="floor"></div></div><div class="shade"></div><header class="head">${button('back','‹')}<div class="title"><strong>${legend?'Легенда · ':''}${h.name}</strong><div class="tags">${h.faction}</div></div><span class="money">◉ ${s.sol.toLocaleString('ru-RU')}</span>${button('stats','Статы')}${button('bio','Био')}${button('close','×')}</header><section class="group left"><h2>Умения</h2>${legend?button('ulta',`<span class="glyph">✷</span><span><b>Ульта</b><small>${s.ulta?'Открыта':'Закрыта'}</small></span>`,'skill signature'):''}<div class="scroll">${skillRows}</div>${button('memory',`<span class="glyph">${mem?s.mem:'ДП'}</span><span><b>Другая память</b><br><small>${mem?'Уровень '+s.mem+' / 7':'Условия открытия'}</small></span>`,'mem',locked)}</section><section class="stage"><div class="shadow"></div>${figure(h)}${v!=='b'?gear:''}<div class="caption">${h.world} · условный 2D-силуэт</div></section><section class="group right"><div class="scroll">${v==='b'&&gear?'<h2>Снаряжение</h2>'+gear:''}${locked?`<h2>Не открыт</h2><p class="value">${s.shards} / 80</p><div class="bar"><i style="width:${Math.min(100,s.shards/80*100)}%"></i></div>${button('unlock','Призвать','action',s.shards<80)}${button('find','Найти осколки','secondary')}`:`<section><h2>Уровень</h2><div class="value">${s.lvl}<small> / 85</small></div><input id="level" type="range" min="${Math.min(85,s.lvl+1)}" max="85" value="85" aria-label="Целевой уровень" ${s.lvl===85?'disabled':''}><p><small>Цель: <b id="target">85</b></small></p>${button('level','Повысить уровень','action',s.lvl===85)}</section><section><h2>Звёзды</h2><div class="stars">${'★'.repeat(s.stars)}<span class="staroff">${'★'.repeat(7-s.stars)}</span></div><small>${s.shards} / 65 осколков</small><div class="bar"><i style="width:${Math.min(100,s.shards/65*100)}%"></i></div>${button('star',s.stars===7?'Максимум':'Повысить до '+(s.stars+1)+'★','action',s.stars===7||s.shards<65)}${button('find','Найти осколки','secondary')}</section>`}</div></section><footer class="bottom">${button('prev','‹')}<div class="meta"><div class="world">${locked?'ЗАКРЫТ':mem?'ДРУГАЯ ПАМЯТЬ':'МОЩЬ'}</div><div class="power">${locked?'—':(18240+(s.lvl-72)*120+(s.stars-5)*950+(mem?s.mem*1000:0)).toLocaleString('ru-RU')}</div></div><small>${locked?'':mem?'ДП '+s.mem:'Сн. '+s.gear+' · '+count+'/6'}</small>${button(locked?'find':mem?'memory':count===6?'tier':'all',locked?'Источники':mem?'Усилить ДП':count===6?'Повысить тир':'Надеть всё','action main',!locked&&!mem&&count!==6&&!s.eq.includes(0)&&!s.eq.includes(2))}${button('next','›')}</footer><div class="toast" id="toast" role="status"></div><div class="modal" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><h2 id="dlg-title"></h2><p id="dlg-text"></p><div id="dlg-actions"></div></div></div>`;let level=$('level');if(level)level.oninput=()=>$('target').textContent=level.value;}
function dialog(title,txt,confirm,label='Подтвердить'){lastFocus=document.activeElement;$('dlg-title').textContent=title;$('dlg-text').textContent=txt;$('dlg-actions').innerHTML=(confirm?'<button id="confirm" class="action">'+label+'</button>':'')+'<button id="cancel">Закрыть</button>';$('modal').hidden=false;$('cancel').onclick=close;if(confirm)$('confirm').onclick=()=>{confirm();render();$('toast').textContent='Действие выполнено в макете';F.querySelector('[data-act="stats"]').focus()};$('cancel').focus()}
function close(){$('modal').hidden=true;lastFocus?.focus()}function changeHero(){$('hero').selectedIndex=1-$('hero').selectedIndex;render()}F.onclick=e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;let s=get(),h=heroes[$('hero').value],st=$('state').value,locked=st==='locked'&&!s.unlocked;let act=(t,x,f,l)=>dialog(t,x,f,l);if(a==='prev'||a==='next')return changeHero();if(a==='stats')return act('Характеристики','Здоровье 32 400 · Защита 24 500 · Скорость 162 · Урон 4 120. Тестовые данные.');if(a==='bio')return act(h.name,h.world+' · '+h.faction+' · Биографическая справка (тест).');if(a==='back'||a==='close')return act('Возврат в ростер','Это автономный макет. В игре здесь выполняется штатная навигация.');if(a==='find')return act('Источники осколков','Кампания / магазин — тестовый переход. Не изменяет игровое сохранение.',()=>s.shards+=20,'Симулировать получение 20');if(a==='unlock')return act('Призвать','80 тестовых осколков',()=>{s.shards-=80;s.unlocked=true;s.stars=1});if(a==='level'){let n=+$('level').value;return act('Повышение уровня',s.lvl+' → '+n+' · демонстрация подтверждения',()=>s.lvl=n)}if(a==='star')return act('Повышение звезды','65 тестовых осколков',()=>{s.shards-=65;s.stars++});if(a==='memory')return act('Другая память',st==='memory'?'Усиление до '+Math.min(7,s.mem+1):'Условия: 7★, снаряжение XIII.',st==='memory'&&s.mem<7?()=>s.mem++:null);if(a==='ulta')return act('Ультимативная способность',s.ulta?'Уже открыта':'Открытие ульты (тест)',!s.ulta&&!locked?()=>s.ulta=true:null);if(a==='all')return act('Надеть всё','Доступные тестовые предметы будут надеты.',()=>s.eq=s.eq.map(x=>x===0||x===2?1:x));if(a==='tier')return act('Снаряжение','Повысить тир',()=>{s.gear=Math.min(13,s.gear+1);s.eq=[0,0,2,0,3,3]});if(a.startsWith('slot')){let i=+a.slice(4),x=s.eq[i];return act('Предмет '+(i+1),['Готов к надеванию','Уже надет','Можно создать','Не хватает компонентов'][x],x===0||x===2?()=>s.eq[i]=1:null)}if(a.startsWith('skill')){let i=+a.slice(5);return act(h.skills[i],'Уровень '+s.skills[i]+' / 8 · описание и стоимость (тест)',!locked&&s.skills[i]<8?()=>s.skills[i]++:null)}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)close();if(e.key==='Tab'&&!$('modal').hidden){let b=[...$('modal').querySelectorAll('button')],i=b.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&i===b.length-1){e.preventDefault();b[0].focus()}}});['variant','hero','state','size'].forEach(id=>$(id).onchange=render);$('reset').onclick=()=>{progress={};render()};render();</script></body></html>
