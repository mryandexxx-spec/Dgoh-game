<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BH2 · Легенда Барона · макет без игровых данных</title>
<style>
:root{--night:#131920;--panel:#24252a;--line:#735b43;--sand:#ead8b3;--dust:#b5a78f;--spice:#ce955b;--no:#965d50;--ok:#65a18b}
*{box-sizing:border-box}body{margin:0;background:#0e131a;color:var(--sand);font:12px system-ui,-apple-system,sans-serif}h1,h2,h3,p{margin:0}h1{font-size:17px}h2{font-size:12px;color:var(--spice)}h3{font-size:12px}
main{padding:16px;display:grid;gap:14px;justify-content:center}section>h2{margin-bottom:8px}
.screen{position:relative;overflow:hidden;background:linear-gradient(150deg,#1a2228,#17161d 70%,#30251e);border:1px solid var(--line);border-radius:13px;padding:9px;display:flex;flex-direction:column;gap:8px}.screen.large{width:844px;height:390px}.screen.small{width:667px;height:375px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top .title{font-size:16px;color:var(--sand)}.nav{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--dust)}
.cols{display:grid;grid-template-columns:28% 37% 35%;gap:6px;flex:1;min-height:0}.panel{min-width:0;min-height:0;background:#25242aee;border:1px solid #685440;border-radius:10px;padding:8px;overflow:auto}
.portrait{height:84px;display:flex;justify-content:center;align-items:center;border-radius:8px;background:radial-gradient(circle at center,#755544,#28242b 70%);border:1px solid #8c6746;font-size:52px;color:#cc9b71}
.desc{font-size:10px;color:var(--dust);line-height:1.35;margin:6px 0}.tag{font-size:10px;color:var(--spice)}.progress{height:5px;background:#10181e;border-radius:10px;overflow:hidden;margin:7px 0}.progress b{display:block;width:10%;height:100%;background:var(--spice)}.reqs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.req{display:flex;align-items:center;gap:5px;border:1px solid #5c4e44;background:#302c2c;border-radius:6px;padding:4px;font-size:10px;white-space:nowrap}.req>i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#463b35;color:#d6b899;font-style:normal}.req small{font-size:9px;color:var(--dust);display:block}.req.ok{border-color:var(--ok)}.req.ok small{color:var(--ok)}
.stages{display:grid;gap:4px}.stage{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;padding:5px;border:1px solid #66533e;border-radius:6px;background:#302b2a}.stage strong{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#554636;color:#edd3aa}.stage small{display:block;color:var(--dust);font-size:9px}.button{background:#4e4540;color:#b9aa97;border:1px solid #806a4f;padding:5px;border-radius:5px;font-size:10px}.button.lock{opacity:.55}.foot{font-size:9px;color:var(--dust)}
.small .cols{grid-template-columns:23% 41% 36%;gap:4px}.small .panel{padding:5px}.small .portrait{height:68px;font-size:41px}.small .desc{font-size:9px}.small .reqs{gap:3px}.small .req{padding:2px;font-size:9px;gap:3px}.small .req>i{width:18px;height:18px}.small .stage{padding:4px;gap:3px}.small .nav{font-size:9px}
.note{max-width:844px;line-height:1.5;color:#d3c4af}
</style></head><body><main><div class="note"><h1>BH2 · Путь легендарного Барона</h1><p>Статический HTML-макет на художественное согласование. Имена «Герой 04» и этапы здесь — заглушки, НЕ утверждённые игровые данные. Макет не включает механику или награды.</p></div>
<script>
const items=['Молодой Барон','Марго','Юэ','Герой 04','Герой 05','Герой 06','Герой 07','Герой 08','Герой 09','Герой 10'];
for(const [w,h,label] of [[844,390,'iPhone 844 × 390'],[667,375,'iPhone SE 667 × 375']]){
 const section=document.createElement('section');section.innerHTML='<h2>'+label+'</h2>';
 const screen=document.createElement('div');screen.className='screen '+(w===844?'large':'small');
 screen.innerHTML='<div class="top"><span class="nav">‹ ЛЕГЕНДЫ</span><span class="title">ВОСХОЖДЕНИЕ БАРОНА</span><span class="nav">ПУТЬ · 0 / 5</span></div><div class="cols"><div class="panel"><div class="portrait">♛</div><h3 style="margin-top:6px">Барон Харконнен · Легенда</h3><p class="desc">Отдельный герой. Концепт, портрет и умения добавляются в художественном пакете BH3.</p><div class="tag">НЕ ОТКРЫТ · 0/5 ЭТАПОВ</div></div><div class="panel"><h3>ПОДГОТОВКА ГЕРОЕВ · 1/10</h3><div class="progress"><b></b></div><div class="reqs">'+items.map((n,i)=>'<div class="req '+(i===0?'ok':'')+'"><i>'+(i+1)+'</i><span>'+n+'<small>7★ · XIII · '+(i===0?'ДП 7':'ДП —')+'</small></span></div>').join('')+'</div><p class="foot" style="margin-top:4px">Все требования выполняются до первого боя.</p></div><div class="panel"><h3>ПЯТЬ ЭТАПОВ ВОСХОЖДЕНИЯ</h3><div class="stages">'+Array.from({length:5},(_,i)=>'<div class="stage"><strong>'+(i+1)+'</strong><span>Этап '+(i+1)+'<small>Сюжетная пятёрка · состав уточняется</small></span><span class="button lock">ЗАМОК</span></div>').join('')+'</div><p class="foot" style="margin-top:5px">Бои открываются по порядку.</p></div></div>';
 section.appendChild(screen);document.querySelector('main').appendChild(section);
}
</script>
</main></body></html>
