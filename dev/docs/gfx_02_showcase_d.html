function get(){const st=$('state').value,k=$('hero').value+':'+st;return progress[k]??={lvl:st==='memory'||st==='g13'?85:72,stars:st==='locked'?0:st==='memory'||st==='g13'?7:5,shards:65,gear:st==='memory'||st==='g13'?13:9,eq:st==='memory'||st==='g13'?[1,1,1,1,1,1]:[1,0,2,1,0,3],mem:st==='memory'?3:0,skills:[5,6,4,5,3],ulta:false,sol:2846000};}

const memory=btn('memory',`<span class="plaque"><img src="${url('img/memory-rank-plaque.webp')}" onerror="this.hidden=true" alt=""><b>${mem?s.mem:'·'}</b></span><span><strong>Другая память</strong><small>${locked?'После открытия':mem?'ДП '+s.mem+' / 7':canWake(s)?'Доступно пробуждение':'7★ и снаряжение XIII · 6/6'}</small></span><span class="arrow">›</span>`,'memoryrow',false,'Другая память');
let action=locked?(s.shards>=80?'unlock':'find'):mem?'memory':cnt===6?'tier':'all';let label=locked?(s.shards>=80?'Призвать':'Найти осколки'):mem?(s.mem===7?'ДП7 · максимум':'Усилить Другую память'):cnt===6?(s.gear===13?(canWake(s)?'Пробудить Другую память':'Условия пробуждения'):'Повысить до '+roman[s.gear+1]):'Надеть всё'+(available?' · '+available:'');
F.innerHTML=`<div class="art" style="background-image:url('data:image/webp;base64,${ART[key]}')"></div><header class="header">${btn('back','‹','back',false,'Назад')}<span class="crumb">Герои / развитие</span><span class="world">${h.world}</span><span class="resource"><img src="${url('img/solari-stack.webp')}" onerror="this.hidden=true" alt="">${fmt(s.sol)}</span>${btn('find',icon('find'),'iconbtn',false,'Найти осколки')}${btn('bio',icon('bio'),'iconbtn',false,'Биография')}${btn('close','×','close',false,'Закрыть')}</header><section class="leftzone">${identity}</section><section class="rightzone">${readout+skillSection+gear+memory}</section><footer class="footer">${btn('prev','‹','nav',false,'Предыдущий герой')}<span class="worldlabel">${h.world}<span>Витрина героя · концепт</span></span>${btn(action,label+' <span class="chev">›</span>','primary',mem&&s.mem===7||(!locked&&!mem&&cnt!==6&&!available))}${btn('next','›','nav',false,'Следующий герой')}</footer><div id="toast" class="toast" role="status"></div><div id="modal" class="dialogwrap" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt"></h2><p id="dp"></p><div id="extra"></div><div id="actions" class="actions"></div></div></div>`;
}
function dialog(t,x,confirm,label='Подтвердить',extra=''){lastFocus=document.activeElement;focusAct=lastFocus?.dataset.act||'';$('dt').textContent=t;$('dp').textContent=x;$('extra').innerHTML=extra;$('actions').innerHTML=(confirm?`<button id="confirm" class="primary">${label}</button>`:'')+'<button id="cancel">Закрыть</button>';$('modal').hidden=false;$('cancel').onclick=close;if(confirm)$('confirm').onclick=()=>{confirm();render();$('toast').textContent='Выполнено · тест';(F.querySelector(`[data-act="${focusAct}"]:not(:disabled)`)||F.querySelector('[data-act="stats"]')).focus()};$('cancel').focus()}
function close(){$('modal').hidden=true;lastFocus?.focus()}
F.onclick=e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;const s=get(),h=heroes[$('hero').value],locked=!s.stars;if(a==='prev'||a==='next'){$('hero').selectedIndex=1-$('hero').selectedIndex;return render()}if(a==='stats')return dialog('Характеристики','Здоровье 32 400 · Защита 24 500 · Скорость 162 · Урон 4 120 (условно).');if(a==='bio')return dialog(h.name,h.world+' · '+h.faction+' · '+h.role+'.');if(a==='back'||a==='close')return dialog('Возврат в ростер','В игре здесь штатная навигация.');if(a==='find')return dialog('Источники осколков','Кампания / магазин — тестовый переход.',()=>s.shards+=20,'Получить 20 (тест)');if(a==='unlock'&&locked&&s.shards>=80)return dialog('Призвать','80 тестовых осколков',()=>{s.shards-=80;s.stars=1;s.lvl=1;s.gear=1;s.eq=[0,0,2,1,0,3]});if(a==='level'&&!locked&&s.lvl<85)return dialog('Повышение уровня','Выберите целевой уровень. Стоимость условная.',()=>s.lvl=+$('level').value,'Повысить',`<label>Уровень ${s.lvl} → <output id="target">85</output><input id="level" aria-label="Целевой уровень" type="range" min="${s.lvl+1}" max="85" value="85" oninput="document.getElementById('target').value=this.value"></label>`);if(a==='star'&&!locked&&s.stars<7&&s.shards>=65)return dialog('Повышение звезды','65 тестовых осколков',()=>{s.shards-=65;s.stars++});if(a==='memory'||a==='tier'&&s.gear===13)return dialog('Другая память',s.mem?'Усиление до '+Math.min(7,s.mem+1):canWake(s)?'Пробуждение ДП1: требования выполнены.':'Условия: 7★, снаряжение XIII, 6/6 предметов.',!locked&&(canWake(s)||s.mem>0&&s.mem<7)?()=>{s.mem++}:null,canWake(s)?'Пробудить':'Усилить');if(a==='ulta')return dialog('Ультимативная способность',s.ulta?'Уже открыта':'Открытие ульты (условное)',!s.ulta&&!locked?()=>s.ulta=true:null);if(a==='all'&&!locked&&!s.mem)return dialog('Надеть всё','Доступные тестовые предметы будут надеты.',()=>s.eq=s.eq.map(x=>x===0||x===2?1:x));if(a==='tier'&&!locked&&s.eq.every(x=>x===1)&&s.gear<13)return dialog('Снаряжение','Повысить тир до '+roman[s.gear+1],()=>{s.gear++;s.eq=[0,0,2,0,3,3]});if(a.startsWith('slot')){let i=+a.slice(4),x=s.eq[i];return dialog('Предмет '+(i+1),['Готов к надеванию','Уже надет','Можно создать','Не хватает компонентов'][x],x===0||x===2?()=>s.eq[i]=1:x===3?()=>s.eq[i]=2:null,x===3?'Найти (тест)':x===2?'Создать и надеть':'Надеть')}if(a.startsWith('skill')){let i=+a.slice(5);return dialog(h.skills[i][1],h.skills[i][2]+' Уровень '+s.skills[i]+' / 8 (тест).',!locked&&s.skills[i]<8?()=>s.skills[i]++:null,'Улучшить')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)close();if(e.key==='Tab'&&!$('modal').hidden){let b=[...$('modal').querySelectorAll('button,input')],i=b.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&i===b.length-1){e.preventDefault();b[0].focus()}}});['hero','state','size'].forEach(id=>$(id).onchange=render);$('reset').onclick=()=>{progress={};render()};render();

</script></body></html>
