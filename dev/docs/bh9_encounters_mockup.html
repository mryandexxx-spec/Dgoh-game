<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>

<h1>BH9 · Пять боёв «Восхождение Барона»</h1>
<p>Интерактивности и игровой логики нет. Это статический макет **на согласование**, не действующий экран. Союзники фиксированы и утверждены; противники и награды — предложения. Блокировка до выполнения десяти требований сохраняется.</p>
<div id="screens"></div>
<script>
const stages=[
 ['Тайный союз',['Барон','Питер','Фейд','Раббан','Марго'],['Хават','Гурни','Дункан','Лето','Пол']],
 ['Печать императора',['Шаддам','Фенринг','Марго','Мохиам','Сардаукар'],['Лето','Хават','Джессика','Гурни','Дункан']],
 ['Цена предательства',['Юэ','Питер','Барон','Мохиам','Фенринг'],['Лето','Джессика','Хават','Дункан','Гурни']],
 ['Ночь над Арракином',['Барон','Фейд','Раббан','Питер','Сардаукар'],['Дункан','Гурни','Хават','Лето','Пол']],
 ['Триумф Барона',['Барон','Фейд','Раббан','Шаддам','Фенринг'],['Лето','Дункан','Гурни','Хават','Джессика']]
];
for(const [w,h] of [[844,390],[667,375]]) {
const frame=document.createElement('section');frame.className='frame '+(w===844?'wide':'narrow');
const index=3, s=stages[index];
frame.innerHTML='<div class="head"><span>‹ ЛЕГЕНДЫ</span><strong>ВОСХОЖДЕНИЕ БАРОНА</strong><span>0/5 · ЗАКРЫТО</span></div>'+
'<div class="columns"><div class="panel"><h3>ПЯТЬ СЮЖЕТНЫХ ЭТАПОВ</h3><div class="stages">'+
stages.map((t,i)=>'<div class="stage '+(i===index?'selected':'')+'"><b>'+('0'+(i+1))+'</b><span>'+t[0]+'</span></div>').join('')+
'</div><div class="pill">Все 10 требований обязательны</div></div>'+
'<div class="panel"><h3>IV · '+s[0]+'</h3><div class="hint">Сюжетно фиксированный союзный отряд — утверждено</div>'+
s[1].map((name,i)=>'<div class="hero">'+(i+1)+'. '+name+'<span>7★ · XIII</span></div>').join('')+
'<div class="warning">Бой недоступен до выполнения всех требований. Марго и Юэ не имеют источника получения.</div></div>'+
'<div class="panel"><h3>ПРОТИВНИКИ · ПРОЕКТ</h3>'+s[2].map((name,i)=>'<div class="hero">'+(i+1)+'. '+name+'</div>').join('')+
'<div class="hint">Волны, сложность и награды ещё не утверждены.</div><div class="pill">🔒 НАЧАТЬ БОЙ</div></div></div>';
document.getElementById('screens').appendChild(Object.assign(document.createElement('h2'),{textContent:'iPhone '+w+' × '+h}));document.getElementById('screens').appendChild(frame);
}
</script></main></body></html>
