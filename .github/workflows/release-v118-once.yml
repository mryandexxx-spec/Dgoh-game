name: One-time owner-approved C4.15 v118 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_15_V118_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v118-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v118-once:
    name: Dispatch owner-approved v118 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v118') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard version, old PWA, approved C4.15 and title before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":118}'
          grep -Fq "const VER = '687dd0b25e'" sw.js
          test -f dev/src/render3d/scenes/campaign-shield-wall-scar.js
          grep -Fq "'L:6': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "shield-wall-scar" dev/src/render3d/scenes/campaign-map.js
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v118"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v118 dispatch submitted for ${GITHUB_SHA}"
