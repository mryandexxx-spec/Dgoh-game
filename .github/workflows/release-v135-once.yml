name: One-time owner-approved ARCH-01C5a-B1 v135 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C5A_B1_V135_RELEASE_HANDOFF_2026_11_18.md
      - .github/workflows/release-v135-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v135-once:
    name: Dispatch owner-approved validated v135 exactly once
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v135') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Fail closed on exact release source, version, immutable B1 source and old Pages root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show --format=%s -s HEAD)" = 'release(arch): publish v135'
          test "$(git rev-parse HEAD^)" = '0486a33bf9eaf71336665c5188e9d9b324fa27f5'
          test "$(tr -d '\n' < dev/version.json)" = '{"v":135}'
          grep -Fq "const VER = 'a93dcde641';" sw.js
          test "$(git hash-object sw.js)" = '1df70b2c9ef2a28b79bd029489598f0dc7442de4'
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' \
            .github/workflows/release-v135-once.yml \
            dev/CHANGES_STATUS.md \
            dev/docs/ARCH01C5A_B1_V135_RELEASE_HANDOFF_2026_11_18.md \
            dev/version.json | LC_ALL=C sort)"
          test "$(git hash-object dev/src/data/conquest-data.js)" = 'ff0015453b5113e9d0c4bd9f3f2e1bf3739e6d6a'
          test "$(git hash-object dev/src/ui/views/conq.js)" = 'e93d51583d00ff17762c98f3cb380773bd8b053c'
          test "$(git hash-object dev/tools/split.config.mjs)" = 'd33d662ba3f801579d5cdc6c9fcba3027928643a'
          test "$(git hash-object dev/tools/arch-import-baseline.json)" = '43352a85cdc7e2698643bc5865afba34cadbef32'
          test "$(git hash-object dev/tests/ci/arch01c5a-b1-real-bootstrap-contract.mjs)" = '8b7e4291415000638ea8e5e850e1d8a00c61665b'
          test "$(git hash-object dev/tests/ci/arch01c5a-b1-real-lifecycle.mjs)" = '84685a0662b732f3e80a0fb5484fd896b401b144'
          test "$(git hash-object dev/tests/ci/arch01c5a-b1-approved-order.json)" = '2926eda1c8de7258460c35be8b7541d46261b659'
          test "$(git hash-object .github/workflows/validate-pwa.yml)" = 'd6478fac5f9d1ff57c4ddac9174664d0ff2c0392'
          grep -Fq "import '../overlays/celebrate.js'; // ARCH-01C5a-B1 UI-owned Conquest bootstrap" dev/src/ui/views/conq.js
          ! grep -Fq "import '../ui/overlays/celebrate.js'" dev/src/data/conquest-data.js
          grep -Fq "import '../assets/models.js'; // порядок исполнения" dev/src/data/story.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('dev/tools/arch-import-baseline.json','utf8'));
          if(JSON.stringify(d.legacy)!==JSON.stringify(['data/story.js -> assets/models.js']))throw Error('Wrong remaining historical debt');
          const a=JSON.parse(fs.readFileSync('dev/tests/ci/arch01c5a-b1-approved-order.json','utf8'));
          const b=JSON.parse(fs.readFileSync('dev/tests/ci/arch01c5a-b1-v134-order.json','utf8'));
          if(a.length!==167||b.length!==167||a.filter((x,i)=>x!==b[i]).length!==47)throw Error('47 marker exception changed');
          NODE
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          echo "v135 one-shot guard passed. Dispatching official full validated publish at $GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pwa.yml/dispatches" -f ref=main -f 'inputs[publish]=true'
          echo 'Official workflow_dispatch publish=true requested; independently verify full CI and Pages before claiming release.'
