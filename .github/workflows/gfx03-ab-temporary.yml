name: GFX-03 faction environment A/B (temporary)
on:
  push:
    branches: [qa/gfx03-worlds-ab]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - hero: stilgar
            profile: low
            width: 667
            height: 375
          - hero: mohiam
            profile: med
            width: 667
            height: 375
          - hero: shaddam
            profile: low
            width: 844
            height: 390
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - uses: actions/checkout@v4
        with:
          ref: 16d79bedd1dbc33f21c34a25f322472167b55fbd
          path: candidate
      - name: Build exact v159 candidate
        working-directory: candidate/dev
        run: |
          npm ci
          npm run build
          cp ../../dev/tests/smoke/gfx03-ab-once.mjs tests/smoke/
          mkdir -p /tmp/gfx159
          cp -a dist/pwa /tmp/gfx159/pwa
      - name: Download validated v158
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45505592598 --name dune-validated-build --dir /tmp/gfx158
      - name: Compare actual WebGL on both mobile profiles and sizes and desktop HIGH
        working-directory: candidate/dev
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HERO: ${{ matrix.hero }}
        run: |
          mkdir -p /tmp/gfx03-qa
          profile="${{ matrix.profile }}"
          width="${{ matrix.width }}"
          height="${{ matrix.height }}"
          for trial in 1 2 3; do
            versions="158 159"; if [ "$trial" = 2 ]; then versions="159 158"; fi
            for version in $versions; do
              name="$version-$trial"
              node tests/smoke/gfx03-ab-once.mjs "/tmp/gfx$version/pwa/index.html" --phone --width "$width" --height "$height" --hero "$HERO" --dpr 1 --gfx "$profile" --shot "/tmp/gfx03-qa/$name.png" --out "/tmp/gfx03-qa/$name.json"
            done
          done
      - name: Median paired p95 comparison
        run: |
          python3 - <<'PY'
          import pathlib,json,statistics
          p=pathlib.Path('/tmp/gfx03-qa')
          values={v:[json.loads((p/f'{v}-{i}.json').read_text())['sample']['p95Interval'] for i in (1,2,3)] for v in (158,159)}
          a,b=(statistics.median(values[v]) for v in (158,159))
          print('GFX03_REPEAT', values, 'median',a,b,'delta_pct',round((b/a-1)*100,2))
          assert b <= a*1.1, 'p95 regression > 10%'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx03-repeat-${{ matrix.hero }}
          path: /tmp/gfx03-qa/
          retention-days: 7
