name: ARCH-02C-B3 mandatory writer fast acceptance

on:
  pull_request:
    branches: [main, feature/arch02c-b4-b4a-conquest-claims, feature/arch02c-b4-b4b1-conquest-disks, feature/arch02c-b6a-market-recycler, feature/arch02c-b6b-hero-upgrades]
    paths:
      - 'dev/src/**'
      - 'dev/tests/ci/arch02c-**'
      - 'dev/tests/ci/arch02d-**'
      - 'dev/tests/lib/**'
      - 'dev/tests/economy/**'
      - 'dev/tests/golden/saves.mjs'
      - 'dev/tests/smoke/gear-e3-dom.mjs'
      - 'dev/tests/smoke/pkg8-layout.mjs'
      - 'dev/tests/smoke/baron-legend-gl.mjs'
      - 'dev/package.json'
      - 'dev/package-lock.json'
      - '.github/workflows/arch02c-b3-fast-acceptance.yml'
      - '.github/workflows/validate-pwa.yml'

permissions:
  contents: read

concurrency:
  group: arch02c-b3-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mandatory-writer-native:
    name: Mandatory PWA + HTML and native Web Locks (NO RELEASE)
    runs-on: ubuntu-24.04
    # B4b1b adds six intact 104-week pressure scenarios; the prior 20-minute
    # cap cancelled BH8 AFTER its PASS, before the final Chromium recovery job.
    # Extend wall-clock budget; never skip/shorten any acceptance or golden.
    timeout-minutes: 36
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - name: ECON-01 deterministic F2P economy model acceptance (read-only)
        run: node tests/economy/acceptance.mjs
      - run: node tools/check-deps.mjs --strict
      - run: npm run build
      - name: ECON-01 approved energy in built PWA + HTML (v1-compatible)
        run: |
          node tests/ci/econ01-energy-acceptance.mjs dist/pwa/index.html
          node tests/ci/econ01-energy-acceptance.mjs dist/artifact.html
      - name: ECON-01 optional daily quest OR goals (no reward duplication)
        run: |
          node tests/ci/econ01-daily-acceptance.mjs dist/pwa/index.html
          node tests/ci/econ01-daily-acceptance.mjs dist/artifact.html
      - run: node tools/check-bundle.mjs dist/pwa/app.js
      - name: Mandatory ordinary startup on both compiled artifacts
        run: |
          node tests/ci/arch02c-b3-b1c-b3-mandatory-boot-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b3-b1c-b3-mandatory-boot-acceptance.mjs dist/artifact.html
      - name: Exact golden save snapshots after mandatory asynchronous boot (PWA + HTML)
        run: |
          node tests/golden/saves.mjs dist/artifact.html
          node tests/golden/saves.mjs dist/pwa/index.html
      - name: ARCH-02C-B4-B4a verified Conquest track and chest claims (PWA + HTML)
        run: |
          node tests/ci/arch02c-b4-b4a-conquest-claims-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b4-b4a-conquest-claims-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B4-B4b1 one-time Conquest disk grants (PWA + HTML)
        run: |
          node tests/ci/arch02c-b4-b4b1-conquest-disks-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b4-b4b1-conquest-disks-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B4-B4b2 verified Conquest economy (PWA + HTML)
        run: |
          node tests/ci/arch02c-b4-b4b2-conquest-economy-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b4-b4b2-conquest-economy-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B5a daily quest and chest claims (PWA + HTML)
        run: |
          node tests/ci/arch02c-b5a-daily-claims-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b5a-daily-claims-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B5b verified login calendar (PWA + HTML)
        run: |
          node tests/ci/arch02c-b5b-login-calendar-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b5b-login-calendar-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B6a verified shops, refills and recycler (PWA + HTML)
        run: |
          node tests/ci/arch02c-b6a-market-recycler-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b6a-market-recycler-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B6b verified hero upgrades and crafting (PWA + HTML)
        run: |
          node tests/ci/arch02c-b6b-upgrade-crafting-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b6b-upgrade-crafting-acceptance.mjs dist/artifact.html
      - name: ARCH-02C-B6c verified feat claims and raid start (PWA + HTML)
        run: |
          node tests/ci/arch02c-b6c-feat-raid-acceptance.mjs dist/pwa/index.html
          node tests/ci/arch02c-b6c-feat-raid-acceptance.mjs dist/artifact.html
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: ARCH-02D-B4a offline restart clock characterization (PWA + HTML, TZ matrix; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4-offline-clock-characterization.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4-offline-clock-characterization.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b0 forward-week and daily entitlement clock baseline (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b-entitlement-clock-characterization.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b-entitlement-clock-characterization.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b1 full Conquest week retention (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b1-conquest-week-retention.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b1-conquest-week-retention.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b1b archive quota, growth and transfer limits (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b1b-archive-pressure.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b1b-archive-pressure.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b1c offline JSON file export/import (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b1c-file-transfer-acceptance.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b1c-file-transfer-acceptance.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b1d SHA-256 Conquest archival roundtrip and additive recovery (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b1d-conquest-archive-acceptance.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b1d-conquest-archive-acceptance.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b2 historical paid-day entitlement replay guard (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b2-daily-entitlement-acceptance.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b2-daily-entitlement-acceptance.mjs dist/artifact.html
          done
      - name: ARCH-02D-B4b1e manual oldest-week Conquest retention and verified restore (PWA + HTML, 3 TZ; NO RELEASE)
        run: |
          for zone in UTC Europe/Amsterdam America/Los_Angeles; do
            TZ="$zone" node tests/ci/arch02d-b4b1e-manual-retention-acceptance.mjs dist/pwa/index.html
            TZ="$zone" node tests/ci/arch02d-b4b1e-manual-retention-acceptance.mjs dist/artifact.html
          done
      - name: Real Chromium unflagged automatic PWA bootstrap
        run: node tests/ci/arch02c-b3-b1c-b3-native-auto-chromium.mjs
      - name: Real Chromium two-tab lifecycle and lease-loss regression
        run: node tests/ci/arch02c-b3-b1b-real-multitab-chromium.mjs
      - name: Mobile E3 DOM waits for guarded bootstrap
        run: node tests/smoke/gear-e3-dom.mjs dist/pwa/index.html
      - name: Arena 5x5 WebGL real camera and low-end frames
        run: node tests/smoke/pkg8-layout.mjs dist/pwa/index.html dist/pkg8-shots
      - name: Historical v75 standalone Arena baseline (NO new writer API)
        run: node tests/smoke/pkg8-layout.mjs ../index.html dist/pkg8-shots --baseline
      - name: BH8 staged Baron mobile WebGL 844/667 writer-ready frames
        run: node tests/smoke/baron-legend-gl.mjs dist/pwa/index.html
      - name: Real Chromium protected import and explicit backup recovery
        run: node tests/ci/arch02c-b3-b2-a2-real-chromium.mjs
      - name: ARCH-02D-B4b1c native browser JSON download and file-picker restore (PWA + HTML; NO RELEASE)
        run: node tests/ci/arch02d-b4b1c-native-file-chromium.mjs
      - name: ARCH-02D-B4b1d real Chromium archive download and additive restore (PWA + HTML; NO RELEASE)
        run: node tests/ci/arch02d-b4b1d-native-archive-chromium.mjs
      - name: ARCH-02D-B4b1e real Chromium manual history pruning and native verified recovery (PWA + HTML; NO RELEASE)
        run: node tests/ci/arch02d-b4b1e-native-retention-chromium.mjs
