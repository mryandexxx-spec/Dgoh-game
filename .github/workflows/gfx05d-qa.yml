name: GFX-05/D verified progression QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'dev/tests/smoke/gfx05d-verified.mjs'
      - '.github/workflows/gfx05d-qa.yml'
permissions:
  contents: read
jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [med, low]
        width: [844, 667]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - name: Install pinned dependencies
        working-directory: dev
        run: npm ci
      - name: Build actual PWA
        working-directory: dev
        run: npm run build
      - name: Verify real writer and motion
        working-directory: dev
        run: node tests/smoke/gfx05d-verified.mjs dist/pwa/index.html ${{ matrix.profile }} ${{ matrix.width }} gfx05d-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx05d-${{ matrix.profile }}-${{ matrix.width }}
          path: dev/gfx05d-evidence
          if-no-files-found: warn
