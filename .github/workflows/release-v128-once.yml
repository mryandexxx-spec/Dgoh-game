name: One-time owner-approved ARCH-01C3a1/a2 v128 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C3_V128_RELEASE_HANDOFF_2026_11_17.md
      - .github/workflows/release-v128-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v128-once:
    name: Dispatch owner-approved v128 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v128') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed v128 source, original root, 8-edge boundary and cosmetic proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git show --format=%s -s HEAD)" = "release(arch): publish v128"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":128}'
          grep -Fq "const VER = '2e36ce669d'" sw.js
          test -f dev/docs/ARCH01C3_V128_RELEASE_HANDOFF_2026_11_17.md
          test -f dev/src/logic/cosmetics-unlocks.js
          test -f dev/tests/arch01c3a1-cosmetics-snapshot.mjs
          test -f dev/tests/arch01c3a2-worm-avatar-html.mjs
          test -f dev/tests/ci/arch01c3a2-worm-boundary.mjs
          grep -Fq "import '../logic/cosmetics-unlocks.js'" dev/src/ui/wiring.js
          grep -Fq "import { WORM_IMG } from '../../assets/models.js'" dev/src/ui/overlays/profile.js
          grep -Fq 'EMBLEMS.worm.svg =' dev/src/ui/overlays/profile.js
          ! grep -Fq 'WORM_IMG' dev/src/data/cosmetics.js
          grep -Fq "import '../logic/stats.js'" dev/src/data/cosmetics.js
          grep -Fq "import '../assets/models.js'" dev/src/data/story.js
          node -e 'const fs=require("fs"),b=require("./dev/tools/arch-import-baseline.json");if(b.legacy.length!==8||b.legacy.some(e=>!e.startsWith("data/"))||b.legacy.some(e=>e==="data/cosmetics.js -> core/state.js"||e==="data/cosmetics.js -> logic/progress.js"||e==="data/cosmetics.js -> assets/models.js")||!b.legacy.includes("data/cosmetics.js -> logic/stats.js")||!b.legacy.includes("data/story.js -> assets/models.js"))process.exit(1);const s=fs.readFileSync("dev/tools/split.config.mjs","utf8");if(!s.includes("logic/cosmetics-unlocks.js"))process.exit(1)'
          echo "Dispatch exact validated v128 from ${GITHUB_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v128 validated release dispatched for ${GITHUB_SHA}"
