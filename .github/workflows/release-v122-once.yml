name: One-time owner-approved C4.19 v122 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_19_V122_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v122-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v122-once:
    name: Dispatch owner-approved v122 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v122') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact release, previous production cache, and approved Dark VI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":122}'
          grep -Fq "const VER = '9f55a9a721'" sw.js
          test -f dev/src/render3d/scenes/campaign-salusa-legions.js
          grep -Fq "'D:5': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "buildSalusaWindMarch" dev/src/render3d/scenes/campaign-map.js
          grep -Fq "['D',5]" dev/tests/smoke/campaign-lifecycle.mjs
          grep -Fq "PASS C4.19 Salusa Wind-Erased March actual WebGL" dev/tests/smoke/campaign20.mjs
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v122"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v122 validated publication dispatched for ${GITHUB_SHA}"
