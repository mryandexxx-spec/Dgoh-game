name: v82 one-shot accepted icon-free lobby golden
on:
  push:
    branches: [feature/v82-arrakis-daylight-hub]
    paths: [.github/workflows/v82-accepted-icon-golden.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v82-arrakis-daylight-hub
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - name: Update only accepted icon removal in 5 lobby golden screen snapshots
        working-directory: dev
        run: |
          node --input-type=module <<'JS'
          import {readGolden,writeGolden} from './tests/lib/golden.mjs';
          const raw=JSON.parse(readGolden('screens'));
          const changed=[];
          const rx=/<span class="sicon"><svg[^>]*>#[0-9a-f]{10}<\/svg><\/span>/g;
          for (const screen of raw.screens) {
            const before=screen.view||'';
            const after=before.replace(rx,'');
            if (before!==after) {
              const count=(before.match(rx)||[]).length;
              if (count!==7) throw Error('unexpected icon count '+screen.name+': '+count);
              screen.view=after;
              changed.push(screen.name);
            }
          }
          if (changed.length!==5) throw Error('expected exactly 5 affected lobby snapshots, got '+changed.join(','));
          console.log('Approved icon removal in:',changed.join(', '));
          writeGolden('screens',{...raw.meta,screens:raw.screens});
          JS
      - name: Build and verify golden against actual browser DOM
        working-directory: dev
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/dom/screens.mjs dist/pwa/index.html
      - name: Commit approved baseline and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tests/golden/data/screens.json.gz.b64
          git rm .github/workflows/v82-accepted-icon-golden.yml
          git commit -m "test(v82): accept icon-free lobby in five golden screen snapshots"
          git push origin HEAD:feature/v82-arrakis-daylight-hub
