name: Validate Dune GoH PWA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Временная операция для явно согласованной пересъёмки E3.
  # Только внутренняя ветка pkg7-wip и явный маркер в заголовке PR; запуск вручную разрешён владельцем.
  update-e3-golden:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'pkg7-wip' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[E3-UPDATE-GOLDEN]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pkg7-wip
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - name: Re-record four approved E3 golden suites
        run: node tests/run.mjs dist/pwa/index.html --update
      - name: Verify artifact with updated golden snapshots
        run: node tests/run.mjs dist/artifact.html
      - name: Commit only golden snapshots to working branch
        run: |
          git config user.name "dune-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/data/
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "test(pkg7): update approved E3 golden snapshots"
          git push origin HEAD:refs/heads/pkg7-wip
  build-and-test:
    name: Build, golden tests and 3D smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check module layering
        run: node tools/check-deps.mjs

      - name: Build PWA and artifact (without deploying)
        run: npm run build

      - name: Validate bundle order and exported names
        run: node tools/check-bundle.mjs dist/pwa/app.js

      - name: Install Playwright for DOM golden tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Install Chrome for DOM and WebGL smoke tests
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Verify E3 recipes and crafting
        run: node tests/smoke/gear-e3.mjs

      - name: Smoke test E3 UI (844 and iPhone SE)
        run: node tests/smoke/gear-e3-dom.mjs dist/pwa/index.html

      - name: Smoke test DOM layout (phone)
        run: node tests/smoke/dom.mjs dist/pwa/index.html --phone --only item,itempart --win 800

      # The smoke script's --strict mode also enforces 400 ms transitions and
      # zero warm-up shader compilations, which are nondeterministic on shared
      # GitHub runners (SwiftShader). We gate resource safety and console errors,
      # and retain full timings/compilation output as diagnostic artifacts.
      - name: Smoke test 3D lifecycle (phone)
        run: |
          set -o pipefail
          node tests/smoke/3d.mjs dist/pwa/index.html --cycles 2 --phone | tee dist/smoke-phone.log
          grep -Fq 'PASS один WebGL-контекст' dist/smoke-phone.log
          grep -Fq 'PASS нет роста meshes/textures' dist/smoke-phone.log
          grep -Fq 'PASS нет ошибок консоли' dist/smoke-phone.log

      - name: Run golden tests for PWA and artifact
        run: npm test

      - name: Upload E3 layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-e3-screens-${{ github.run_number }}
          path: dev/dist/e3-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-3d-smoke-${{ github.run_number }}
          path: dev/dist/smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload testable PWA bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pwa-preview-${{ github.run_number }}
          path: |
            dev/dist/pwa/
            dev/dist/dune-pwa-flat.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dune-artifact-${{ github.run_number }}
          path: |
            dev/dist/artifact.html
            dev/dist/artifact-files.json
            dev/dist/app.js
            dev/dist/app.css
            dev/dist/babylon3d.js
            dev/dist/assets/
          if-no-files-found: warn
          retention-days: 14
