    needs: [plan, build]
    if: ${{ needs.plan.outputs['arena-ab'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gfx: [med, low]
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Compare deployed baseline with the exact candidate build
        run: node tests/smoke/ab.mjs ../index.html dist/pwa/index.html --phone --gfx ${{ matrix.gfx }},${{ matrix.gfx }} --out dist/arena-ab-${{ matrix.gfx }}
        env:
