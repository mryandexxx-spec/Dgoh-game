name: Validate Dune GoH PWA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build once + architecture + SHA-256 manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - run: node tools/check-deps.mjs
      - run: npm run build
      - run: node tools/check-bundle.mjs dist/pwa/app.js
      - run: node tests/smoke/gear-e3.mjs
      - run: node tools/ci-artifact.mjs make
      - name: Upload the only production build
        uses: actions/upload-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist/
          if-no-files-found: error
          retention-days: 14

  golden:
    name: Golden (200 battles, meta, saves, 41 screens; PWA + artifact)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm test

  ui:
    name: E3 iPhone UI + DOM idle layout
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: node tests/smoke/gear-e3-dom.mjs dist/pwa/index.html
      - run: node tests/smoke/dom.mjs dist/pwa/index.html --phone --only item,itempart --win 800
      - name: Package 8 reference v75 screenshots (844/667)
        run: node tests/smoke/pkg8-layout.mjs ../index.html dist/pkg8-shots --baseline
      - name: Package 8 real WebGL camera and formation (844/667)
        run: node tests/smoke/pkg8-layout.mjs dist/pwa/index.html dist/pkg8-shots
      - name: Package 10 B1 real panorama (844/667, MED/LOW, three zones)
        run: node tests/smoke/pkg10-lobby.mjs dist/pwa/index.html dist/pkg10-shots
      - name: Package 9 HUD interactive phone check (844/667)
        run: node tests/smoke/pkg9-hud.mjs dist/pwa/index.html dist/pkg9-shots
      - name: Package 9 idle DOM (phone + desktop)
        run: |
          node tests/smoke/dom.mjs dist/pwa/index.html --phone --only bwait --win 800
          node tests/smoke/dom.mjs dist/pwa/index.html --only bwait --win 800
      - name: Upload package 10 B1 panorama screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg10-lobby-${{ github.run_number }}
          path: dev/dist/pkg10-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package 9 real HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg9-hud-${{ github.run_number }}
          path: dev/dist/pkg9-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package 8 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg8-camera-${{ github.run_number }}
          path: dev/dist/pkg8-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload E3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-e3-screens-${{ github.run_number }}
          path: dev/dist/e3-*.png
          if-no-files-found: ignore
          retention-days: 14

  three-d:
    name: 3D lifecycle + memory + WebGL console (phone)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # SwiftShader transition timings are diagnostics, not shared-runner gates.
      - name: Phone 3D resource safety
        shell: bash
        run: |
          set -o pipefail
          node tests/smoke/3d.mjs dist/pwa/index.html --cycles 2 --phone | tee dist/smoke-phone.log
          grep -Fq 'PASS один WebGL-контекст' dist/smoke-phone.log
          grep -Fq 'PASS нет роста meshes/textures' dist/smoke-phone.log
          grep -Fq 'PASS нет ошибок консоли' dist/smoke-phone.log
      - name: Compare v76 / v77 SwiftShader budgets (MED/LOW phone)
        run: |
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx med --out dist/perf-v76-med.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx med --out dist/perf-med.json
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx low --out dist/perf-v76-low.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx low --out dist/perf-low.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let failed = false;
          const fmt = x => Number(x.toFixed(2));
          for (const gfx of ['med','low']) {
            const a = JSON.parse(fs.readFileSync('dist/perf-v76-'+gfx+'.json'));
            const b = JSON.parse(fs.readFileSync('dist/perf-'+gfx+'.json'));
            const rt = x => x.battle.vram.rows.filter(v => v.rt).reduce((sum,v)=>sum+v.mb,0)
              + x.battle.vram.depthMB + x.battle.vram.backbufMB;
            const entries = [
              ['draws',a.battle.cost.draws,b.battle.cost.draws],
              ['passes',a.battle.cost.passes,b.battle.cost.passes],
              ['mpx',a.battle.cost.mpx,b.battle.cost.mpx],
              ['RT+backbuffer MB',rt(a),rt(b)],
            ];
            for (const [metric,before,after] of entries) {
              const delta=100*(after/before-1);
              console.log(gfx.toUpperCase(),metric,fmt(before),'→',fmt(after),fmt(delta)+'%');
              if (delta>10) {console.error('REGRESSION > 10%:',gfx,metric);failed=true;}
            }
          }
          if (failed) process.exitCode=1;
          JS
      - name: Package 10 camp frame budget vs deployed v77 (MED/LOW phone)
        run: |
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx med --out dist/perf-b1-base-med.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx med --out dist/perf-b1-med.json
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx low --out dist/perf-b1-base-low.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx low --out dist/perf-b1-low.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let bad=false;
          for(const p of ['med','low']) {
            const a=JSON.parse(fs.readFileSync('dist/perf-b1-base-'+p+'.json')).camp;
            const b=JSON.parse(fs.readFileSync('dist/perf-b1-'+p+'.json')).camp;
            const rt=x=>x.vram.rows.filter(v=>v.rt).reduce((sum,v)=>sum+v.mb,0)+x.vram.depthMB+x.vram.backbufMB;
            for(const [k,v0,v1] of [['draws',a.cost.draws,b.cost.draws],['passes',a.cost.passes,b.cost.passes],['mpx',a.cost.mpx,b.cost.mpx],['RT MB',rt(a),rt(b)]]) {
              const delta=v0?100*(v1/v0-1):0;
              console.log('B1',p,k,v0,'→',v1,delta.toFixed(1)+'%');
              if(delta>10){ console.error('B1 REGRESSION >10%',p,k);bad=true; }
            }
          }
          if(bad) process.exit(1);
          JS
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg9-perf-${{ github.run_number }}
          path: dev/dist/perf-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload 3D diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-3d-smoke-${{ github.run_number }}
          path: dev/dist/smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: All required checks passed
    if: always()
    needs: [build, golden, ui, three-d]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject any failed or skipped required check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['RESULTS'])
          bad = {key: value['result'] for key, value in jobs.items() if value['result'] != 'success'}
          print('Required checks:', {key: value['result'] for key, value in jobs.items()})
          if bad:
              print('FAIL:', bad, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Rehearse publishing the exact CI build (no push)
        uses: actions/checkout@v4
      - name: Download the same validated build for deployment rehearsal
        uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - name: Stage, verify bytes, and ensure no source changed
        shell: bash
        run: |
          cd dev
          node tools/ci-artifact.mjs stage
          cd ..
          git diff --exit-code -- dev
