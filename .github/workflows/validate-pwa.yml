  gate:
    name: All required checks passed
    if: always()
    needs: [plan, build, golden, pwa, ui, ui-campaign, campaign-lifecycle, ui-heroes, ui-arena, three-d, three-d-desktop, perf, bh8-preview, bh98-procedural, md-ult1, arena-animation, arena-ab]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject failed checks and unexpected skips
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node dev/tools/ci-gate.mjs
      - name: Download the same validated build for deployment rehearsal
        if: ${{ needs.plan.outputs.mode != 'docs' }}
        uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - name: Stage, verify bytes, and ensure no source changed
        if: ${{ needs.plan.outputs.mode != 'docs' }}
        shell: bash
        run: |
          cd dev
          node tools/ci-artifact.mjs rehearse
          cd ..
          git diff --exit-code -- dev

      - name: Certify verified inputs, test coverage and build artifact
        if: ${{ needs.plan.outputs.mode != 'docs' }}
        env:
          RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node dev/tools/ci-receipt.mjs
      - name: Publish immutable validation receipt
        if: ${{ needs.plan.outputs.mode != 'docs' }}
        uses: actions/upload-artifact@v4
        with:
          name: dune-validation-receipt
          path: dev/ci-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Publish verified PWA to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.mode != 'docs' }}
    needs: [plan, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - name: Bind publication to current main with identical tested inputs
        run: node dev/tools/ci-current-main.mjs
      - name: Verify exact validated release bits and SHA-256
        run: node dev/tools/ci-artifact.mjs verify
      - name: Stage exact validated files into the repository root
        run: |
          node dev/tools/ci-artifact.mjs stage
          git diff --exit-code -- dev
      - name: Synchronize published PWA in main without rerunning builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html app.js app.css sw.js babylon3d.js assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified PWA from CI artifact"
            git push origin HEAD:main
          fi
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload exact tested PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: dev/dist/pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
