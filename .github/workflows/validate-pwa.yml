name: Validate Dune GoH PWA

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Read-only v76 Pages deployment audit (never merge)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify Pages deployment of exact v76 root commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: 9c1d84bd8de4699575b6df67d46dc2e11a886e7e
        run: |
          for n in $(seq 1 18); do
            echo "=== Deployment audit attempt $n ==="
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" > "$RUNNER_TEMP/runs.json"
            if python3 - <<'PY'
          import json, os, sys
          runs = json.load(open(os.environ['RUNNER_TEMP'] + '/runs.json'))['workflow_runs']
          sha = os.environ['DEPLOYED_SHA']
          matches = [r for r in runs if r.get('head_sha') == sha]
          for r in matches:
              print(r['id'], r['name'], r['status'], r['conclusion'], r['head_sha'])
          sys.exit(0 if any('pages' in r['name'].lower() and r['conclusion'] == 'success' for r in matches) else 1)
          PY
            then
              echo "SUCCESS: GitHub Pages deployed exact v76 commit $DEPLOYED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No successful Pages deployment found for $DEPLOYED_SHA"
          exit 1
