name: Validate Dune GoH PWA

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, golden tests and 3D smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check module layering
        run: node tools/check-deps.mjs

      - name: Build PWA and artifact (without deploying)
        run: npm run build

      - name: Validate bundle order and exported names
        run: node tools/check-bundle.mjs dist/pwa/app.js

      - name: Install Playwright for DOM golden tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Install Chrome for DOM and WebGL smoke tests
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Run golden tests for PWA and artifact
        run: npm test

      - name: Smoke test 3D lifecycle (phone)
        run: node tests/smoke/3d.mjs dist/pwa/index.html --cycles 2 --phone --strict

      - name: Smoke test 3D lifecycle (desktop)
        run: node tests/smoke/3d.mjs dist/pwa/index.html --cycles 2 --strict

      - name: Upload testable PWA bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pwa-preview-${{ github.run_number }}
          path: |
            dev/dist/pwa/
            dev/dist/dune-pwa-flat.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packaged artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dune-artifact-${{ github.run_number }}
          path: |
            dev/dist/artifact.html
            dev/dist/artifact-files.json
            dev/dist/app.js
            dev/dist/app.css
            dev/dist/babylon3d.js
            dev/dist/assets/
          if-no-files-found: warn
          retention-days: 14
