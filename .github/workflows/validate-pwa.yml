name: Validate Dune GoH PWA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      scope: ${{ steps.scope.outputs.scope }}
      decision: ${{ steps.scope.outputs.decision }}
      reuse_run_id: ${{ steps.scope.outputs.reuse_run_id }}
      build: ${{ steps.scope.outputs['build'] }}
      golden: ${{ steps.scope.outputs['golden'] }}
      pwa: ${{ steps.scope.outputs['pwa'] }}
      ui: ${{ steps.scope.outputs['ui'] }}
      ui-campaign: ${{ steps.scope.outputs['ui-campaign'] }}
      campaign-lifecycle: ${{ steps.scope.outputs['campaign-lifecycle'] }}
      ui-heroes: ${{ steps.scope.outputs['ui-heroes'] }}
      ui-arena: ${{ steps.scope.outputs['ui-arena'] }}
      three-d: ${{ steps.scope.outputs['three-d'] }}
      three-d-desktop: ${{ steps.scope.outputs['three-d-desktop'] }}
      perf: ${{ steps.scope.outputs['perf'] }}
      bh8-preview: ${{ steps.scope.outputs['bh8-preview'] }}
      bh98-procedural: ${{ steps.scope.outputs['bh98-procedural'] }}
      md-ult1: ${{ steps.scope.outputs['md-ult1'] }}
      arena-animation: ${{ steps.scope.outputs['arena-animation'] }}
      arena-ab: ${{ steps.scope.outputs['arena-ab'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI selection and resource-result validation
        run: |
          node dev/tests/ci/selection.mjs
          node dev/tests/ci/proof.mjs
          node dev/tests/ci/resource-growth.mjs
      - name: Determine scope from the actual git diff
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node dev/tools/ci-plan.mjs

  build:
    name: Build once + architecture + SHA-256 manifest
    needs: plan
    if: ${{ needs.plan.outputs['build'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: npm ci
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tools/check-deps.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: npm run build
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tools/check-bundle.mjs dist/pwa/app.js
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/arena-hud-layout.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/young-baron-cpu.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-contract.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-progress.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-future-heroes.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-approved-data.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh9-encounters.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh9-battle.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh9-event.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh99-public-journey.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh9-hero-kits.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh94-story-events.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh95-integration.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh96-story-screen.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-bh97-character-release.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-horror.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-abilities.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-mechanics.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-gl-greed.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-staged-kit.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-roster-integration.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-model-asset.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/muad-dib-asset.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/muad-dib-skinning.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/muad-dib-babylon.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/arena-animation-recovery.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-animation.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-skinning.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/baron-legend-cinematic.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/gear-e3.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/gear-ge1.mjs
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/memory-ix.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/v83-v85.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tests/smoke/jihad-j1.mjs dist/pwa/index.html
      - if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: node tools/ci-artifact.mjs make
      - name: Download proven build without rebuilding
        if: ${{ needs.plan.outputs.mode == 'reuse' }}
        env:
          PLAN: ${{ needs.plan.outputs.decision }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-download.mjs
      - name: Verify reused build against current inputs and SHA-256
        if: ${{ needs.plan.outputs.mode == 'reuse' }}
        run: node tools/ci-artifact.mjs verify
      - name: Upload the only production build
        uses: actions/upload-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist/
          if-no-files-found: error
          retention-days: 14

  golden:
    name: Golden (200 battles, meta, saves, 41 screens; PWA + artifact)
    needs: [plan, build]
    if: ${{ needs.plan.outputs['golden'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - run: npm test

  pwa:
    name: PWA update + offline + boot fallback
    needs: [plan, build]
    if: ${{ needs.plan.outputs['pwa'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Service worker installs even if optional 3D asset stalls
        run: node tests/sw-install-stall.mjs
      - name: Core model stalled on iPhone must not block 3D lobby
        run: node tests/smoke/core-model-stall.mjs dist/pwa/index.html
      - name: Optional Muad-Dib download must not block 3D lobby
        run: node tests/smoke/optional-model-boot.mjs dist/pwa/index.html
      - name: PWA update and offline assets
        run: node tests/smoke/sw.mjs .. dist/pwa

  ui:
    name: E3 iPhone UI + DOM idle layout
    needs: [plan, build]
    if: ${{ needs.plan.outputs['ui'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: node tests/smoke/gear-e3-dom.mjs dist/pwa/index.html
      - run: node tests/smoke/memory-ix-dom.mjs dist/pwa/index.html
      - run: node tests/smoke/dom.mjs dist/pwa/index.html --phone --only item,itempart --win 800
      - name: Upload E3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-e3-screens-${{ github.run_number }}
          path: dev/dist/e3-*.png
          if-no-files-found: ignore
          retention-days: 14

  ui-campaign:
    name: Campaign 2.0 + lobby mobile WebGL
    needs: [plan, build]
    if: ${{ needs.plan.outputs['ui-campaign'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Campaign 2.0 camera-aligned touch geometry
        run: node tests/campaign-gestures.mjs
      - name: Campaign 2.0 Caladan real WebGL UX (844/667 MED/LOW)
        run: node tests/smoke/campaign20.mjs dist/pwa/index.html dist/campaign20-shots
      - name: Upload Campaign 2.0 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-campaign20-${{ github.run_number }}
          path: dev/dist/campaign20-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package 10 B1 real panorama (844/667, MED/LOW, three zones)
        run: node tests/smoke/pkg10-lobby.mjs dist/pwa/index.html dist/pkg10-shots
      - name: Upload package 10 B1 panorama screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg10-lobby-${{ github.run_number }}
          path: dev/dist/pkg10-shots/
          if-no-files-found: ignore
          retention-days: 14

  campaign-lifecycle:
    name: Campaign lifecycle (MED/LOW phone + HIGH desktop)
    needs: [plan, build]
    if: ${{ needs.plan.outputs['campaign-lifecycle'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Verify campaign mount/render/dispose and stable resources
        run: node tests/smoke/campaign-lifecycle.mjs dist/pwa/index.html

  ui-heroes:
    name: Duncan + Muad Dib + Young Baron mobile WebGL
    needs: [plan, build]
    if: ${{ needs.plan.outputs['ui-heroes'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Duncan Meshy real WebGL rig and clips (844/667 MED/LOW)
        run: |
          node tests/smoke/duncan-meshy-webgl.mjs dist/pwa/index.html
          node tests/smoke/duncan-meshy-arena.mjs dist/pwa/index.html
      - name: Upload Duncan Meshy WebGL frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-duncan-meshy-${{ github.run_number }}
          path: dev/dist/duncan-meshy-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Muad Dib legendary mobile card 844/667 MED/LOW
        run: node tests/smoke/muad-dib.mjs dist/pwa/index.html
      - name: Young Baron source clips, portrait cache and A/B (844/667 MED/LOW)
        run: node tests/smoke/young-baron.mjs dist/pwa/index.html ../index.html
      - name: Upload Muad Dib 3D visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-muaddib-${{ github.run_number }}
          path: dev/dist/muad-dib-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Young Baron visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-young-baron-${{ github.run_number }}
          path: dev/dist/young-baron-shots/
          if-no-files-found: ignore
          retention-days: 14

  ui-arena:
    name: Arena framing + HUD + idle DOM
    needs: [plan, build]
    if: ${{ needs.plan.outputs['ui-arena'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Package 8 reference v75 screenshots (844/667)
        run: node tests/smoke/pkg8-layout.mjs ../index.html dist/pkg8-shots --baseline
      - name: Package 8 real WebGL camera and formation (844/667)
        run: node tests/smoke/pkg8-layout.mjs dist/pwa/index.html dist/pkg8-shots
      - name: Close arena + non-overlapping world HUD (MED/LOW/HIGH)
        run: node tests/smoke/arena-framing-preview.mjs dist/pwa/index.html dist/arena-framing
      - name: Package 9 HUD interactive phone check (844/667)
        run: node tests/smoke/pkg9-hud.mjs dist/pwa/index.html dist/pkg9-shots
      - name: Package 9 idle DOM (phone + desktop)
        run: |
          node tests/smoke/dom.mjs dist/pwa/index.html --phone --only bwait --win 800
          node tests/smoke/dom.mjs dist/pwa/index.html --only bwait --win 800
      - name: Upload close arena and indicator checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-arena-framing-${{ github.run_number }}
          path: dev/dist/arena-framing/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package 9 real HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg9-hud-${{ github.run_number }}
          path: dev/dist/pkg9-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload package 8 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg8-camera-${{ github.run_number }}
          path: dev/dist/pkg8-shots/
          if-no-files-found: ignore
          retention-days: 14

  three-d:
    name: 3D lifecycle + memory + WebGL console (phone)
    needs: [plan, build]
    if: ${{ needs.plan.outputs['three-d'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # SwiftShader transition timings are diagnostics, not shared-runner gates.
      - name: Phone 3D resource safety
        shell: bash
        run: |
          set -o pipefail
          node tests/smoke/3d.mjs dist/pwa/index.html --cycles 3 --phone --resource-strict --out dist/smoke-phone.json | tee dist/smoke-phone.log
      - name: Upload 3D diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-3d-smoke-phone-${{ github.run_number }}
          path: dev/dist/smoke-*
          if-no-files-found: ignore
          retention-days: 14

  three-d-desktop:
    name: 3D lifecycle + memory + WebGL console (desktop)
    needs: [plan, build]
    if: ${{ needs.plan.outputs['three-d-desktop'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # SwiftShader transition timings are diagnostics, not shared-runner gates.
      - name: Desktop 3D resource safety
        shell: bash
        run: |
          set -o pipefail
          node tests/smoke/3d.mjs dist/pwa/index.html --cycles 3 --resource-strict --out dist/smoke-desktop.json | tee dist/smoke-desktop.log
      - name: Upload 3D diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-3d-smoke-desktop-${{ github.run_number }}
          path: dev/dist/smoke-*
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Camp + battle budgets (MED/LOW phone)
    needs: [plan, build]
    if: ${{ needs.plan.outputs['perf'] == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dune-validated-build
          path: dev/dist
      - run: node tools/ci-artifact.mjs verify
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # SwiftShader transition timings are diagnostics, not shared-runner gates.
      - name: Measure baseline/candidate once + check battle budgets (MED/LOW phone)
        run: |
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx med --out dist/perf-v76-med.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx med --out dist/perf-med.json
          node tests/smoke/perf.mjs ../index.html --phone --dpr 3 --gfx low --out dist/perf-v76-low.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --dpr 3 --gfx low --out dist/perf-low.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let failed = false;
          const fmt = x => Number(x.toFixed(2));
          for (const gfx of ['med','low']) {
            const a = JSON.parse(fs.readFileSync('dist/perf-v76-'+gfx+'.json'));
            const b = JSON.parse(fs.readFileSync('dist/perf-'+gfx+'.json'));
            const rt = x => x.battle.vram.rows.filter(v => v.rt).reduce((sum,v)=>sum+v.mb,0)
              + x.battle.vram.depthMB + x.battle.vram.backbufMB;
            const entries = [
              ['draws',a.battle.cost.draws,b.battle.cost.draws],
              ['passes',a.battle.cost.passes,b.battle.cost.passes],
              ['mpx',a.battle.cost.mpx,b.battle.cost.mpx],
              ['RT+backbuffer MB',rt(a),rt(b)],
            ];
            for (const [metric,before,after] of entries) {
              const delta=100*(after/before-1);
              console.log(gfx.toUpperCase(),metric,fmt(before),'→',fmt(after),fmt(delta)+'%');
              if (delta>10) {console.error('REGRESSION > 10%:',gfx,metric);failed=true;}
            }
          }
          if (failed) process.exitCode=1;
          JS
      - name: Check camp budgets from the same measurements (MED/LOW phone)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let bad=false;
          for(const p of ['med','low']) {
            const a=JSON.parse(fs.readFileSync('dist/perf-v76-'+p+'.json')).camp;
            const b=JSON.parse(fs.readFileSync('dist/perf-'+p+'.json')).camp;
            const rt=x=>x.vram.rows.filter(v=>v.rt).reduce((sum,v)=>sum+v.mb,0)+x.vram.depthMB+x.vram.backbufMB;
            for(const [k,v0,v1] of [['draws',a.cost.draws,b.cost.draws],['passes',a.cost.passes,b.cost.passes],['mpx',a.cost.mpx,b.cost.mpx],['RT MB',rt(a),rt(b)]]) {
              const delta=v0?100*(v1/v0-1):0;
              console.log('B1',p,k,v0,'→',v1,delta.toFixed(1)+'%');
              if(delta>10){ console.error('B1 REGRESSION >10%',p,k);bad=true; }
            }
          }
          if(bad) process.exit(1);
          JS
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg9-perf-${{ github.run_number }}
          path: dev/dist/perf-*.json
          if-no-files-found: ignore
          retention-days: 14

