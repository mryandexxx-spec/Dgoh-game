name: One-time owner-approved C4.17 v120 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_17_V120_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v120-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v120-once:
    name: Dispatch owner-approved v120 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v120') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard version, previous production SW, approved C4.17 and exact release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":120}'
          grep -Fq "const VER = '5433bc45aa'" sw.js
          test -f dev/src/render3d/scenes/campaign-iron-quota.js
          grep -Fq "'D:3': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "buildIronQuota" dev/src/render3d/scenes/campaign-map.js
          grep -Fq "['D',3]" dev/tests/smoke/campaign-lifecycle.mjs
          grep -Fq "PASS C4.17 Iron Quota real WebGL" dev/tests/smoke/campaign20.mjs
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v120"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v120 validated publication dispatched for ${GITHUB_SHA}"
