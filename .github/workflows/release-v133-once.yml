name: One-time owner-approved ARCH-01C4a v133 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C4A_V133_RELEASE_HANDOFF_2026_11_17.md
      - .github/workflows/release-v133-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v133-once:
    name: Dispatch owner-approved v133 validated Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v133') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed version/root, three-edge ledger and unchanged Conquest notifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show --format=%s -s HEAD)" = 'release(arch): publish v133'
          test "$(tr -d '\n' < dev/version.json)" = '{"v":133}'
          grep -Fq "const VER = '2c8aab985b'" sw.js
          test -f dev/docs/ARCH01C4A_V133_RELEASE_HANDOFF_2026_11_17.md
          test -f dev/tests/ci/arch01c4a-b1-boundary.mjs
          test -f dev/tests/arch01c4a-boss-bootstrap.mjs
          test "$(git hash-object dev/src/data/boss.js)" = 'a137d0b4bc5d3b195129b6ac5519e9056b30e369'
          test "$(git hash-object dev/src/logic/battle/stats.js)" = 'cd162eef6eecdaed169304742ee0b1356add5f1e'
          test "$(git hash-object dev/tools/split.config.mjs)" = 'c672428f89b7f089c929336f0c9eb773abfeb8ae'
          test "$(git hash-object dev/tools/arch-import-baseline.json)" = '78d4feaeb0557dab9b49ff28b9a81e1f665b2391'
          test "$(git hash-object dev/tests/arch01c4a-boss-bootstrap.mjs)" = '4740e49731310939515c8b50d6cad773b7276567'
          ! grep -Fq "import '../logic/battle/skills.js'; // порядок исполнения" dev/src/data/boss.js
          grep -Fq "CH.worm = WORM;" dev/src/data/boss.js
          test -f dev/tests/ci/arch01c3b3-boundary.mjs
          test -f dev/tests/arch01c3b3-conquest-selectors.mjs
          test -f dev/tests/ci/arch01c3b1-refill-boundary.mjs
          grep -Fq "import '../assets/models.js'" dev/src/data/story.js
          grep -Fq "import '../ui/overlays/celebrate.js'; // порядок исполнения" dev/src/data/conquest-data.js
          ! grep -Fq "from '../core/state.js'" dev/src/data/conquest-data.js
          ! grep -Fq "function cqBump(" dev/src/data/conquest-data.js
          grep -Fq "function cqBump(ev, s, n = 1, abs = false)" dev/src/logic/conquest.js
          ! grep -Fq "from '../logic/conquest.js'" dev/src/data/conquest-data.js
          ! grep -Fq "const cqK =" dev/src/data/conquest-data.js
          ! grep -Fq "const cqModD =" dev/src/data/conquest-data.js
          ! grep -Fq "const cqScore =" dev/src/data/conquest-data.js
          grep -Fq "const cqK = () => ({ easy: 1, normal: 1.25, hard: 1.5 })[cq().diff] || 1;" dev/src/logic/conquest.js
          ! grep -Fq "import '../logic/stats.js'" dev/src/data/cosmetics.js
          node - <<'NODE'
          const fs=require('fs');
          const b=require('./dev/tools/arch-import-baseline.json');
          const expected=[
            'data/conquest-data.js -> ui/overlays/celebrate.js',
            'data/looks.js -> logic/battle/ai.js',
            'data/story.js -> assets/models.js',
          ];
          if(JSON.stringify(b.legacy)!==JSON.stringify(expected))throw Error('Unexpected three-edge legacy ledger');
          const d=fs.readFileSync('dev/src/data/conquest-data.js','utf8');
          const logic=fs.readFileSync('dev/src/logic/conquest.js','utf8');
          const ui=fs.readFileSync('dev/src/ui/views/conq.js','utf8');
          if(d.includes('NOTES')||d.includes('function cqBump('))throw Error('Conquest data still owns live notification');
          if(!logic.includes("import { NOTES, S } from '../core/state.js';")||
             !logic.includes('CQ_SECT, CQ_STA, cqFeats, cqMod, cqRar')||
             !logic.includes("NOTES.push({ id: Math.random().toString(36).slice(2), kind: 'cqf', F: x.F, v: x.v })"))throw Error('Conquest logic cqBump semantics changed');
          if(!ui.includes("cqTrack, cqTypeN, cqRfN, cqRfCost, cqBump, cqK, cqModD, cqScore } from '../../logic/conquest.js';")||
             !ui.includes("cqMod, cqRar } from '../../data/conquest-data.js';"))throw Error('Conquest named UI API changed');
          const oldK="const cqK = () => ({ easy: 1, normal: 1.25, hard: 1.5 })[cq().diff] || 1;";
          const oldModD="const cqModD = m => { const x = cqMod(m); return typeof x.d === 'function' ? x.d(cqK()) : x.d; };";
          const oldScore="const cqScore = () => { const C = cq(); return C.stars + (C.pts || 0); };";
          for(const fn of [oldK,oldModD,oldScore])if(!logic.includes(fn)||d.includes(fn))throw Error('Conquest selector ownership/semantics drift: '+fn);
          const fnN="const cqRfN = () => (S.cqRf && S.cqRf.d === todayKey()) ? S.cqRf.n : 0;";
          const fnCost="const cqRfCost = () => refillPrice(cqRfN());";
          if(!logic.includes(fnN)||!logic.includes(fnCost))throw Error('Original refill formulas changed');
          const boss=fs.readFileSync('dev/src/data/boss.js','utf8');
          const stats=fs.readFileSync('dev/src/logic/battle/stats.js','utf8');
          if(boss.includes("import '../logic/battle/skills.js'")||
             !boss.includes("import { CH } from './chars.js';")||
             !boss.includes('CH.worm = WORM;')||
             !boss.includes("export { WORM, PHASES, MOVES, RAID_TIERS, phaseOf, STAR_MULT };"))throw Error('WORM boss/raid data ownership regressed');
          if(!stats.includes("import { SK_KEYS, autoSk } from './skills.js';\nimport { STAR_MULT } from '../../data/boss.js';"))throw Error('Exact skills-before-boss predecessor was changed');
          if(!fs.readFileSync('dev/src/data/looks.js','utf8').includes("import '../logic/battle/ai.js'; // порядок исполнения"))throw Error('Known blocked looks→ai predecessor removed');
          if(!fs.readFileSync('dev/tests/ci/arch01c4a-b1-boundary.mjs','utf8').includes('oldGraph'))throw Error('SCC provenance verification missing');
          const split=fs.readFileSync('dev/tools/split.config.mjs','utf8');
          for(const name of ["'logic/conquest.js'","'data/conquest-data.js'","'ui/overlays/celebrate.js'"]){
            if(!split.includes(name))throw Error('SPLIT predecessor missing: '+name);
          }
          NODE
          echo "Dispatch once, owner-approved validated v133 on $GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pwa.yml/dispatches" -f ref=main -f 'inputs[publish]=true'
          echo "Validated v133 publication requested on exact main SHA $GITHUB_SHA"
