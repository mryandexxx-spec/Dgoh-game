name: One-time owner-approved ARCH-02D/FINAL v142 publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v142-once.yml

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: arch02-v142-guard-single-dispatch
  cancel-in-progress: false

jobs:
  publish-v142-once:
    name: Verify approved v142 PR and dispatch validated Pages publish ONCE
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v142') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Fail closed on exact parent, reviewed files, strict CI, old root and PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%s HEAD)" = 'release(arch): publish v142'
          test "$(git rev-parse HEAD^)" = '870d438f70aa036668b34ccdab4438127caebb50'
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = '2'
          test "$(tr -d '\n' < dev/version.json)" = '{"v":142}'
          test "$(git show HEAD^:dev/version.json | tr -d '\n')" = '{"v":141}'

          # Only four reviewed metadata/one-shot paths in the release squash.
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' \
            .github/workflows/release-v142-once.yml \
            dev/CHANGES_STATUS.md \
            dev/docs/ARCH02_V142_RELEASE_HANDOFF_2026_11_22.md \
            dev/version.json | LC_ALL=C sort)"

          # The existing v141 PWA must remain byte-identical until official validated v142 publication.
          grep -Fq "const VER = 'b80d378ad3';" sw.js
          test "$(git rev-parse HEAD:sw.js)" = '855bcef7b0ee24c9147dbd9ca80102496c6c0dfe'
          test "$(git rev-parse HEAD:app.js)" = 'b3a29bc4484b916e335f17038959b68017e8a78b'
          test "$(git rev-parse HEAD:dev/tools/arch-import-baseline.json)" = 'fbf40920c7092eea83238d1320bb188fd8dedc6e'
          test "$(git rev-parse HEAD:dev/tests/ci/arch01c5b-b1-proposed-order.json)" = 'f817f3df91dc75247e049a0e4d512676d2de3fdf'
          test "$(git rev-parse HEAD:.github/workflows/validate-pwa.yml)" = '2dad387e9c851f3df40b7a73b30251284753d8e3'

          node - <<'NODE'
          const fs=require('fs');
          const debt=JSON.parse(fs.readFileSync('dev/tools/arch-import-baseline.json','utf8'));
          if(!Array.isArray(debt.legacy)||debt.legacy.length)throw Error('ARCH baseline debt is not empty');
          const order=JSON.parse(fs.readFileSync('dev/tests/ci/arch01c5b-b1-proposed-order.json','utf8'));
          if(order.length!==167)throw Error('ESM source order changed');
          NODE
          grep -Fq 'arch-strict:' .github/workflows/validate-pwa.yml
          grep -Fq "node tools/check-deps.mjs --strict" .github/workflows/validate-pwa.yml
          grep -Fq "node tools/check-arch-imports.mjs --strict" .github/workflows/validate-pwa.yml
          grep -Fq "if(needs['arch-strict']?.result!=='success')" dev/tools/ci-gate.mjs

          # Squash release must exactly match the successfully tested PR #251 tree.
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/251")"
          echo "$PR_JSON" | jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .merged == true and .merge_commit_sha == $sha and
            .base.ref == "main" and .head.repo.full_name == $repo and
            .draft == false
          ' >/dev/null
          PR_HEAD="$(echo "$PR_JSON" | jq -r '.head.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD" --jq '.tree.sha')" = "$(git rev-parse 'HEAD^{tree}')"

          # A completed exact-head PR Validate SUCCESS includes independent ARCH-01D and final gate.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&per_page=100" |
            jq -e --arg head "$PR_HEAD" '
              .workflow_runs | any(.[]; .head_sha == $head and
                .name == "Validate Dune GoH PWA" and
                .status == "completed" and .conclusion == "success")
            ' >/dev/null
          # No intervening or concurrent update of the release source.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          echo "v142 one-shot guard PASS: approved parent + tested PR tree + old root + strict gate."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo 'Dispatched official validated publish exactly ONCE. Verify full gate and independent Pages.'
