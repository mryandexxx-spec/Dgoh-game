name: One-time owner-approved C4.14 v117 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_14_V117_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v117-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v117-once:
    name: Dispatch owner-approved v117 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v117') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard version, old PWA, and approved source before one-time dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":117}'
          grep -Fq "const VER = 'a2fe3534af'" sw.js
          test -f dev/src/render3d/scenes/campaign-imperial-salt.js
          grep -Fq 'imperial-salt' dev/src/data/campaign-map-presets.js
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Explicit owner-approved v117 publish dispatch submitted for ${GITHUB_SHA}"
