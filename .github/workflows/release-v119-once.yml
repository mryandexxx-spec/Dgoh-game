name: One-time owner-approved C4.16 v119 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_16_V119_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v119-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v119-once:
    name: Dispatch owner-approved v119 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v119') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard version, previous root SW, approved C4.16 code and title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":119}'
          grep -Fq "const VER = '25bfb36516'" sw.js
          test -f dev/src/render3d/scenes/campaign-fading-crown.js
          grep -Fq "'D:2': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "fading-crown" dev/src/render3d/scenes/campaign-map.js
          grep -Fq "['D',2]" dev/tests/smoke/campaign-lifecycle.mjs
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v119"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v119 validated publication dispatched for ${GITHUB_SHA}"
