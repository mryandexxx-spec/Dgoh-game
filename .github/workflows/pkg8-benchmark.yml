name: Package 8 camera A/B performance (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  camera-ab:
    if: github.head_ref == 'pkg8-camera-world-hud'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - name: Build package 8 PWA
        run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Baseline v75 MED and LOW
        shell: bash
        run: |
          node tests/smoke/perf.mjs ../index.html --phone --gfx med --out dist/perf-v75-med.json
          node tests/smoke/perf.mjs ../index.html --phone --gfx low --out dist/perf-v75-low.json
      - name: Package 8 MED and LOW
        shell: bash
        run: |
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --gfx med --out dist/perf-pkg8-med.json
          node tests/smoke/perf.mjs dist/pwa/index.html --phone --gfx low --out dist/perf-pkg8-low.json
      - name: Compare GPU frame budgets against v75
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let bad=false;
          for(const p of ['med','low']){
            const a=JSON.parse(fs.readFileSync('dist/perf-v75-'+p+'.json'));
            const b=JSON.parse(fs.readFileSync('dist/perf-pkg8-'+p+'.json'));
            const rt=v=>v.battle.vram.rows.filter(r=>r.rt).reduce((s,r)=>s+r.mb,0)+v.battle.vram.depthMB;
            for(const [name,oldV,newV] of [
              ['draws',a.battle.cost.draws,b.battle.cost.draws],
              ['passes',a.battle.cost.passes,b.battle.cost.passes],
              ['mpx',a.battle.cost.mpx,b.battle.cost.mpx],
              ['RT MB',rt(a),rt(b)]
            ]){
              const delta=oldV?(newV/oldV-1)*100:0;
              console.log(p+' '+name+' '+oldV+' -> '+newV+' ('+delta.toFixed(1)+'%)');
              if(delta>10){ console.log('::error::Budget over 10%: '+p+' '+name);bad=true; }
            }
          }
          if(bad)process.exit(1);
          JS
      - name: Upload benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dune-pkg8-performance
          path: dev/dist/perf-*.json
          retention-days: 14
          if-no-files-found: ignore
