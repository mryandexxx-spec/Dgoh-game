name: One-time owner-approved ARCH-01B3 v125 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01B3_V125_RELEASE_HANDOFF_2026_11_16.md
      - .github/workflows/release-v125-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v125-once:
    name: Dispatch owner-approved v125 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v125') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact v125 release, prior production and 17-edge data-only baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git show --format=%s -s HEAD)" = "release(arch): publish v125"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":125}'
          grep -Fq "const VER = 'a8637003e4'" sw.js
          test -f dev/src/logic/account-rules.js
          test -f dev/src/logic/cinematic-preference.js
          test -f dev/tests/ci/arch-account-bootstrap.mjs
          test -f dev/docs/ARCH01B3_V125_RELEASE_HANDOFF_2026_11_16.md
          grep -Fq "export * from './account-rules.js'" dev/src/logic/account.js
          grep -Fq "import './wiring.js'" dev/src/ui/fx-text.js
          ! grep -Eq "from ['\"].*ui/|import ['\"].*ui/" dev/src/logic/account.js
          node -e 'const x=require("./dev/tools/arch-import-baseline.json");if(x.legacy.length!==17||x.legacy.some(e=>!e.startsWith("data/")))process.exit(1)'
          printf '%s\n' 'Dispatching approved validated v125 PWA publication for' "${GITHUB_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "One-time owner-approved validated v125 publication dispatched for ${GITHUB_SHA}"
