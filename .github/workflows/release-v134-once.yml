name: One-time owner-approved ARCH-01C4c v134 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C4C_V134_RELEASE_HANDOFF_2026_11_17.md
      - .github/workflows/release-v134-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v134-once:
    name: Dispatch owner-approved v134 validated Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'fix(release): retry v134 guarded publication') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ required by the immutable release-source guard
      - name: Fail-closed owner approval, exact one-shot inputs and frozen ARCH-01C4c B1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show --format=%s -s HEAD)" = 'fix(release): retry v134 guarded publication'
          test "$(git rev-parse HEAD^)" = '57b7a7e4a4d8c1feaeed48c173ab14bd3af5e390'
          test "$(git rev-parse HEAD^^)" = '69d28c29f288f4edf7d33e9862b305b1c0ed7cff'
          test "$(tr -d '\n' < dev/version.json)" = '{"v":134}'
          grep -Fq "const VER = 'e1a6859133';" sw.js
          test "$(git hash-object sw.js)" = '4fb017e5ff4ffe53dc007530ec243c6863daf379'
          test -f dev/docs/ARCH01C4C_V134_RELEASE_HANDOFF_2026_11_17.md
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' \
            .github/workflows/release-v134-once.yml \
            dev/docs/ARCH01C4C_V134_RELEASE_HANDOFF_2026_11_17.md | LC_ALL=C sort)"
          test "$(git hash-object dev/src/boot.js)" = 'f6820015f4f2f7ef83fb3a6e8c95fa1f9290d78b'
          test "$(git hash-object dev/src/data/looks.js)" = '97028873dd87865ef261faad94fd4ff3c9a88bb8'
          test "$(git hash-object dev/src/logic/battle/ai.js)" = '2012c2fe52d41bc4a14c222175187f1ca1a4a291'
          test "$(git hash-object dev/tools/split.config.mjs)" = 'c672428f89b7f089c929336f0c9eb773abfeb8ae'
          test "$(git hash-object dev/tools/arch-import-baseline.json)" = 'ff5809f40e72c2edcb3ebb5a5314c10cfb41b56f'
          test "$(git hash-object dev/tests/ci/arch01c4c-b1-boundary.mjs)" = '0fa8f19a99bcc17fde53514561ddec8d5a350aa3'
          test "$(git hash-object dev/tests/arch01c4c-b1-boot.mjs)" = '782f6fa4326a00b6921acc0fb9b6e8083d6d376d'
          test -f dev/tests/arch01c4a-boss-bootstrap.mjs
          test -f dev/tests/arch01c3b3-conquest-selectors.mjs
          grep -Fq "CH.worm = WORM;" dev/src/data/boss.js
          grep -Fq "import '../ui/overlays/celebrate.js'; // порядок исполнения" dev/src/data/conquest-data.js
          grep -Fq "import '../assets/models.js'; // порядок исполнения" dev/src/data/story.js
          ! grep -Fq "import '../logic/battle/ai.js'; // порядок исполнения" dev/src/data/looks.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('dev/tools/arch-import-baseline.json','utf8'));
          const expected=['data/conquest-data.js -> ui/overlays/celebrate.js','data/story.js -> assets/models.js'];
          if(JSON.stringify(d.legacy)!==JSON.stringify(expected))throw Error('Wrong ARCH-01C4c two-edge baseline');
          const boot=fs.readFileSync('dev/src/boot.js','utf8');
          if(!boot.includes("import './data/gear-cap.js';\nimport './logic/cinematic-preference.js';\nimport './logic/battle/ai.js';\nimport './ui/views/conq.js'; // порядок исполнения"))throw Error('Root bootstrap predecessor drift');
          const looks=fs.readFileSync('dev/src/data/looks.js','utf8');
          if(looks.includes("import '../logic/battle/ai.js'"))throw Error('Legacy data→AI edge returned');
          for(const symbol of ['LOOK','ghash','sigil','SKINS','OL','FEM'])if(!looks.includes(symbol))throw Error('LOOK export missing '+symbol);
          const ai=fs.readFileSync('dev/src/logic/battle/ai.js','utf8');
          if(!ai.includes("if (typeof module !== 'undefined') module.exports"))throw Error('AI compatibility adapter missing');
          const cq=fs.readFileSync('dev/src/data/conquest-data.js','utf8');
          const logic=fs.readFileSync('dev/src/logic/conquest.js','utf8');
          if(cq.includes('function cqBump')||!logic.includes('function cqBump(ev, s, n = 1, abs = false)'))throw Error('Conquest feat owner changed');
          if(!logic.includes("NOTES.push({ id: Math.random().toString(36).slice(2), kind: 'cqf', F: x.F, v: x.v })"))throw Error('Conquest notifications drift');
          if(!fs.readFileSync('dev/tests/run.mjs','utf8').includes("'arch01c4c-b1-boot.mjs'"))throw Error('Real bundled cold/warm test not in golden suite');
          NODE
          echo "Owner-approved v134 retry dispatch after fail-closed source and checkout-depth correction on $GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/validate-pwa.yml/dispatches" -f ref=main -f 'inputs[publish]=true'
          echo "Official validate-pwa.yml publish=true requested for v134; validate both official and independent Pages."
