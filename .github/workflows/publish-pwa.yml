name: Publish Dune GoH PWA

on:
  workflow_run:
    workflows:
      - Validate Dune GoH PWA
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: dune-goh-release
  cancel-in-progress: false

jobs:
  publish:
    # No manual bypass: only a validated release commit on main is publishable.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exactly the validated source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Fail if main advanced after validation
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Download CI artifact from the successful run (no rebuild)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dev/dist
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name dune-validated-build --dir dev/dist

      - name: Verify every artifact SHA-256 and stage exact tested bytes
        working-directory: dev
        run: node tools/ci-artifact.mjs stage

      - name: Commit validated PWA to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html app.js app.css sw.js babylon3d.js assets
          if git diff --cached --quiet; then
            echo "Already deployed: exact validated PWA matches main"
          else
            VERSION=$(node -p "require('./dev/version.json').v")
            git commit -m "deploy: publish Dune GoH v${VERSION} PWA [skip ci]"
            git push origin HEAD:main
          fi
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # GITHUB_TOKEN pushes do not trigger Pages automatically.
      # Exactly one explicit branch-based Pages build request after staged files land.
      - name: Request Pages rebuild once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Verify GitHub Pages deployment completed successfully
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Pages dynamic workflow is asynchronous; require a SUCCESS
          # associated with the exact deployed main commit, never an older one.
          for attempt in $(seq 1 24); do
            SUCCESS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=60" \
              --jq ".workflow_runs[] | select(.name == \"pages build and deployment\" and .head_sha == \"$PUBLISHED_SHA\" and .conclusion == \"success\") | .id")
            if test -n "$SUCCESS"; then
              echo "Pages deployment SUCCESS: $SUCCESS / commit $PUBLISHED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages did not report a successful deployment for $PUBLISHED_SHA"
          exit 1

      - name: Record the published version and tested build hash
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('dev/dist/ci-manifest.json', 'utf8'));
          const text = [
            '### PWA release verification',
            '- Version: v' + m.version,
            '- Cache: ' + m.cache,
            '- Validated source: ${{ github.event.workflow_run.head_sha }}',
            '- Validated workflow: ${{ github.event.workflow_run.id }}',
            '- Verified SHA-256 files: ' + Object.keys(m.hashes).length,
            '- Deployed root HEAD: ' + process.env.PUBLISHED_SHA,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text.join('\n') + '\n');
          JS
