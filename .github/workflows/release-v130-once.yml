name: One-time owner-approved ARCH-01C3b1 v130 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C3B1_V130_RELEASE_HANDOFF_2026_11_17.md
      - .github/workflows/release-v130-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v130-once:
    name: Dispatch owner-approved v130 validated Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v130') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed v130 source, old v129 root, six-edge architecture and Conquest refill owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git show --format=%s -s HEAD)" = 'release(arch): publish v130'
          test "$(tr -d '\n' < dev/version.json)" = '{"v":130}'
          grep -Fq "const VER = 'c79e8f534f'" sw.js
          test -f dev/docs/ARCH01C3B1_V130_RELEASE_HANDOFF_2026_11_17.md
          test -f dev/tests/ci/arch01c3b1-refill-boundary.mjs
          test -f dev/tests/arch01c3b1-conquest-refill.mjs
          test -f dev/tests/ci/arch01c3a3-stats-boundary.mjs
          test -f dev/tests/arch01c3a1-cosmetics-snapshot.mjs
          test -f dev/tests/arch01c3a2-worm-avatar-html.mjs
          grep -Fq "import '../assets/models.js'" dev/src/data/story.js
          grep -Fq "import { WORM_IMG } from '../../assets/models.js'" dev/src/ui/overlays/profile.js
          grep -Fq "import '../logic/cosmetics-unlocks.js'" dev/src/ui/wiring.js
          ! grep -Fq "import '../logic/stats.js'" dev/src/data/cosmetics.js
          ! grep -Fq "import { refillPrice, todayKey } from '../logic/economy.js';" dev/src/data/conquest-data.js
          grep -Fq "import '../ui/overlays/celebrate.js'; // порядок исполнения" dev/src/data/conquest-data.js
          node - <<'NODE'
          const fs = require('fs');
          const b = require('./dev/tools/arch-import-baseline.json');
          const expected = [
            'data/boss.js -> logic/battle/skills.js',
            'data/conquest-data.js -> core/state.js',
            'data/conquest-data.js -> logic/conquest.js',
            'data/conquest-data.js -> ui/overlays/celebrate.js',
            'data/looks.js -> logic/battle/ai.js',
            'data/story.js -> assets/models.js',
          ];
          if (JSON.stringify(b.legacy) !== JSON.stringify(expected)) throw Error('Unexpected legacy data edge ledger');
          const d=fs.readFileSync('dev/src/data/conquest-data.js','utf8');
          const logic=fs.readFileSync('dev/src/logic/conquest.js','utf8');
          const ui=fs.readFileSync('dev/src/ui/views/conq.js','utf8');
          if (d.includes("import { refillPrice, todayKey } from '../logic/economy.js';") ||
              d.includes('const cqRfN =') || d.includes('const cqRfCost =')) throw Error('Conquest data still owns refill economy');
          const fnN="const cqRfN = () => (S.cqRf && S.cqRf.d === todayKey()) ? S.cqRf.n : 0;";
          const fnCost="const cqRfCost = () => refillPrice(cqRfN());";
          if (!logic.includes(fnN+'\n'+fnCost) ||
              !logic.includes("import { enemyProg, refillPrice, todayKey } from './economy.js';")) throw Error('Conquest live refill bodies changed');
          if (!ui.includes("cqTrack, cqTypeN, cqRfN, cqRfCost } from '../../logic/conquest.js';") ||
              !ui.includes("cqModD, cqRar, cqScore } from '../../data/conquest-data.js';")) throw Error('Conquest UI API owner changed');
          const feats=fs.readFileSync('dev/src/ui/views/feats.js','utf8');
          const trials=feats.indexOf("import './trials.js';");
          const stats=feats.indexOf("import { METRIC } from '../../logic/stats.js';");
          const cosmetics=feats.indexOf("import { EMBLEMS, FRAMES, TITLES } from '../../data/cosmetics.js';");
          if (!(trials>=0 && stats>trials && cosmetics>stats)) throw Error('Original UI stats predecessor order drift');
          const split=fs.readFileSync('dev/tools/split.config.mjs','utf8');
          for (const name of ["'logic/conquest.js'", "'data/conquest-data.js'", "'ui/overlays/celebrate.js'", "'logic/cosmetics-unlocks.js'"]) {
            if (!split.includes(name)) throw Error('SPLIT marker missing: '+name);
          }
          NODE
          echo "Dispatch exact owner-approved v130 from ${GITHUB_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "v130 official validated publication dispatched from ${GITHUB_SHA}"
