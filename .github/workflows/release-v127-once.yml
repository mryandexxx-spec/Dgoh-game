name: One-time owner-approved ARCH-01C2a v127 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/ARCH01C2A_V127_RELEASE_HANDOFF_2026_11_16.md
      - .github/workflows/release-v127-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v127-once:
    name: Dispatch owner-approved v127 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(arch): publish v127') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact v127 release and 13-edge boundary before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git show --format=%s -s HEAD)" = "release(arch): publish v127"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":127}'
          grep -Fq "const VER = 'a621fd8b3a'" sw.js
          test -f dev/src/data/campaign-energy.js
          test -f dev/tests/arch01c2a-energy.mjs
          test -f dev/tests/ci/arch01c2a-campaign-energy.mjs
          test -f dev/docs/ARCH01C2A_V127_RELEASE_HANDOFF_2026_11_16.md
          grep -Fq 'const BATTLE_WATER = 6, CANDLE_COST = 8;' dev/src/data/campaign-energy.js
          grep -Fq "from './campaign-energy.js'" dev/src/data/campaigns.js
          grep -Fq "from '../data/campaign-energy.js'" dev/src/logic/economy.js
          node -e 'const x=require("./dev/tools/arch-import-baseline.json");if(x.legacy.length!==13||x.legacy.some(e=>!e.startsWith("data/"))||x.legacy.includes("data/campaigns.js -> logic/economy.js"))process.exit(1)'
          echo "Dispatching validated v127 for ${GITHUB_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "One-time owner-approved validated v127 publication dispatched for ${GITHUB_SHA}"
