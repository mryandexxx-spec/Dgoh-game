name: QA CF01 MPFB (one-shot)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'qa/cf01-mpfb-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          cd "$RUNNER_TEMP"
          curl -fL --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER="$RUNNER_TEMP/blender-4.2.3-linux-x64/blender"
          "$BLENDER" --version
          curl -fL --retry 2 https://api.github.com/repos/makehumancommunity/mpfb2/releases/tags/v2.0.18 -o release.json
          URL=$(python -c 'import json; a=[x["browser_download_url"] for x in json.load(open("release.json"))["assets"] if x["name"].endswith(".zip")]; assert len(a)==1,a; print(a[0])')
          curl -fL --retry 2 "$URL" -o mpfb.zip
          sha256sum mpfb.zip blender.tar.xz
          "$BLENDER" -b --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb.zip"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Export base and report
        env:
          CF_OUT: ${{ runner.temp }}/cf01
        run: |
          "$BLENDER" -b --python-exit-code 1 --python dev/models/character_factory/probe_mpfb.py
          cat "$CF_OUT/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cf01-base-probe
          path: ${{ runner.temp }}/cf01/
          if-no-files-found: error
          retention-days: 7
