name: QA CF03 TripoSR CPU feasibility (one-shot)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'qa/cf01-mpfb-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream CPU inference
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git "$RUNNER_TEMP/triposr"
          cd "$RUNNER_TEMP/triposr"
          git rev-parse HEAD
          python -m pip install 'numpy<2' 'torch==2.5.1' 'torchvision==0.20.1' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'setuptools<81' wheel 'cmake<4' ninja
          python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git'
          python -m pip install 'omegaconf==2.3.0' 'Pillow==10.1.0' 'einops==0.7.0' 'transformers==4.35.0' 'trimesh==4.0.5' 'rembg[cpu]==2.0.57' 'huggingface-hub<1' 'imageio[ffmpeg]' 'xatlas==0.0.9' 'moderngl==5.10.0' 'numpy<2' scipy
      - name: CPU inference on upstream reference (not Stilgar)
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/triposr"
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4
          test -f examples/chair.png
          /usr/bin/time -v python run.py examples/chair.png --device cpu --mc-resolution 128 --output-dir "$RUNNER_TEMP/cf03" --model-save-format glb
          python - <<'PY'
          import pathlib, trimesh, json
          import os
          p=next(pathlib.Path(os.environ["RUNNER_TEMP"]).glob("cf03/**/*.glb"))
          scene=trimesh.load(p,force="scene")
          print("CF03_REPORT",json.dumps({"bytes":p.stat().st_size,"triangles":sum(len(g.faces) for g in scene.geometry.values()),"input":"upstream chair example","status":"CPU feasibility only"}))
          assert p.stat().st_size>1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cf03-cpu-feasibility
          path: ${{ runner.temp }}/cf03/
          retention-days: 7
          if-no-files-found: error
