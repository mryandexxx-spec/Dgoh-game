name: QA CF02 character visual probe (one-shot)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'qa/cf01-mpfb-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Blender and MPFB
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0
          cd "$RUNNER_TEMP"
          curl -fL --retry 2 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER="$RUNNER_TEMP/blender-4.2.3-linux-x64/blender"
          "$BLENDER" --version
          # Official upstream documents building the extension from src/mpfb.
          git clone --depth 1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git mpfb-src
          git -C mpfb-src rev-parse HEAD
          test -f mpfb-src/src/mpfb/blender_manifest.toml
          mkdir -p "$RUNNER_TEMP/mpfb-dist"
          "$BLENDER" -b --command extension build --source-dir "$RUNNER_TEMP/mpfb-src/src/mpfb" --output-dir "$RUNNER_TEMP/mpfb-dist"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/mpfb-dist/*.zip)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[0]}" blender.tar.xz
          "$BLENDER" -b --command extension install-file -r user_default -e "${packages[0]}"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Fetch official CC0 system assets
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 2 --max-time 180 https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o system.zip || curl -fL --retry 2 --max-time 180 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o system.zip
          sha256sum system.zip
          unzip -q system.zip -d system-assets
          for pack in bodyparts05 suits02; do
            curl -fL --retry 2 --max-time 180 "https://files.makehumancommunity.org/asset_packs/$pack/${pack}_cc0.zip" -o "$pack.zip"
            sha256sum "$pack.zip"
            unzip -q "$pack.zip" -d "system-assets/$pack"
          done
      - name: Assemble character and render exported GLB
        env:
          CF_OUT: ${{ runner.temp }}/cf02
          CF_ASSETS: ${{ runner.temp }}/system-assets
        run: |
          "$BLENDER" -b --python-exit-code 1 --python dev/models/character_factory/probe_character.py
          cat "$CF_OUT/candidate-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cf02-character-and-visual-proof
          path: ${{ runner.temp }}/cf02/
          if-no-files-found: error
          retention-days: 7
