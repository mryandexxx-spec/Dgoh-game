name: QA CF04 TRELLIS free API (one-shot)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'qa/cf04-trellis-free-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One public free-tier generation (no token, no paid fallback)
        run: |
          set -euo pipefail
          python -m pip install 'gradio_client>=1.5,<3'
          mkdir -p "$RUNNER_TEMP/cf04"
          base64 -d dev/models/character_factory/stilgar_control_reference.jpg.b64 > "$RUNNER_TEMP/cf04/reference.jpg"
          test "$(git hash-object "$RUNNER_TEMP/cf04/reference.jpg")" = ce5b07c4746fef3a3afa81848ae710f92f5f2438
          python - <<'PY'
          import json, os, pathlib, shutil, struct
          from gradio_client import Client, handle_file
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"cf04"
          client=Client("trellis-community/TRELLIS", token=False, download_files=str(out/"downloads"))
          schema=client.view_api(return_format="dict",print_info=False)
          (out/"schema.json").write_text(json.dumps(schema,indent=2))
          endpoints=schema["named_endpoints"]
          print("CF04_ENDPOINTS",list(endpoints),flush=True)
          assert "/generate_and_extract_glb" in endpoints
          endpoint=endpoints["/generate_and_extract_glb"]
          print("CF04_PARAMETERS",[(p["parameter_name"],p.get("parameter_has_default")) for p in endpoint["parameters"]],flush=True)
          if "/preprocess_image" in endpoints:
              processed=client.predict(handle_file(str(out/"reference.jpg")),api_name="/preprocess_image")
              if isinstance(processed,tuple): processed=processed[0]
              assert isinstance(processed,str) and pathlib.Path(processed).is_file()
              image=handle_file(processed)
          else:
              raise RuntimeError("Preprocessing endpoint unavailable; not submitting generation")
          values={"image":image,"multiimages":[],"is_multiimage":False,"seed":42,"ss_guidance_strength":7.5,"ss_sampling_steps":12,"slat_guidance_strength":3.0,"slat_sampling_steps":12,"multiimage_algo":"stochastic","mesh_simplify":0.95,"texture_size":1024}
          args={}
          for p in endpoint["parameters"]:
              name=p["parameter_name"]
              if name in values:args[name]=values[name]
              elif not p.get("parameter_has_default"):raise RuntimeError("Unexpected required parameter: "+name)
          # Exactly one GPU request. Do not retry or rotate identity if quota is rejected.
          result=client.predict(**args,api_name="/generate_and_extract_glb")
          def files(x):
              if isinstance(x,str) and x.lower().endswith(".glb") and pathlib.Path(x).is_file():yield x
              elif isinstance(x,(tuple,list)):
                  for y in x:yield from files(y)
              elif isinstance(x,dict):
                  for y in x.values():yield from files(y)
          paths=list(files(result))
          assert paths,"No GLB returned"
          target=out/"candidate.glb";shutil.copyfile(paths[0],target)
          raw=target.read_bytes()
          assert raw[:4]==b"glTF" and len(raw)>1024
          n,t=struct.unpack_from("<II",raw,12)
          assert t==0x4e4f534a
          d=json.loads(raw[20:20+n])
          print("CF04_RESULT",json.dumps({"bytes":len(raw),"meshes":len(d.get("meshes",[])),"materials":len(d.get("materials",[])),"images":len(d.get("images",[])),"status":"unrigged, visual review pending"}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf04-trellis-free-api
          path: ${{ runner.temp }}/cf04/
          if-no-files-found: warn
          retention-days: 7
