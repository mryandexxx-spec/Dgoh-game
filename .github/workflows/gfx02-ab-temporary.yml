name: GFX-02 Duncan repeated compact MED QA (temporary branch)
on:
  push:
    branches: [qa/gfx02-duncan-repeat]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - uses: actions/checkout@v4
        with:
          ref: 2259e90de78eb64dc2e413ee1938482d2f3ee344
          path: candidate
      - name: Build exact optimized candidate
        working-directory: candidate/dev
        run: |
          npm ci
          npm run build
          cp ../../dev/tests/smoke/gfx02-ab-once.mjs tests/smoke/
          mkdir -p /tmp/gfx157
          cp -a dist/pwa /tmp/gfx157/pwa
      - name: Download exact validated builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45466003391 --name dune-validated-build --dir /tmp/gfx156
      - name: Alternating repeated compact MED samples and reference screens
        working-directory: candidate/dev
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p /tmp/gfx02-qa
          capture() {
            version="$1"; profile="$2"; width="$3"; rep="$4"
            height=390; if [ "$width" = 667 ]; then height=375; fi
            name="$version-$profile-$width-$rep"
            node tests/smoke/gfx02-ab-once.mjs "/tmp/gfx$version/pwa/index.html" --phone --dpr 1 --gfx "$profile" --width "$width" --height "$height" --shot "/tmp/gfx02-qa/$name.png" --out "/tmp/gfx02-qa/$name.json"
          }
          capture 156 med 667 1
          capture 157 med 667 1
          capture 157 med 667 2
          capture 156 med 667 2
          capture 156 med 667 3
          capture 157 med 667 3
          capture 157 med 844 1
          capture 157 low 667 1
          capture 157 low 844 1
      - name: Report paired p95 and median (software renderer)
        run: |
          python3 - <<'PY'
          import pathlib,json,statistics
          p=pathlib.Path('/tmp/gfx02-qa')
          samples={}
          for v in (156,157):
            samples[v]=[json.loads((p/f'{v}-med-667-{i}.json').read_text())['sample']['p95Interval'] for i in (1,2,3)]
          a,b=[statistics.median(samples[v]) for v in (156,157)]
          print('COMPACT_MED_P95',samples,'median',a,b,'delta_pct',round((b/a-1)*100,1))
          print('Paired changes:',[round((y/x-1)*100,1) for x,y in zip(samples[156],samples[157])])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfx02-duncan-repeat
          path: /tmp/gfx02-qa/
          retention-days: 7
