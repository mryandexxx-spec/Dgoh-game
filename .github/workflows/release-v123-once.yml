name: One-time owner-approved C4.20 v123 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_20_V123_RELEASE_HANDOFF_2026_11_16.md
      - .github/workflows/release-v123-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v123-once:
    name: Dispatch owner-approved v123 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v123') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact release, previous production cache, and approved Dark VII
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":123}'
          grep -Fq "const VER = '8ad3787e3c'" sw.js
          test -f dev/src/render3d/scenes/campaign-broken-seal.js
          grep -Fq "'D:6': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "buildBrokenSeal" dev/src/render3d/scenes/campaign-map.js
          grep -Fq "['D',6]" dev/tests/smoke/campaign-lifecycle.mjs
          grep -Fq "PASS C4.20 Last Stake Broken Seal genuine WebGL" dev/tests/smoke/campaign20.mjs
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v123"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v123 validated publication dispatched for ${GITHUB_SHA}"
