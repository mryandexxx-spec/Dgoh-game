name: One-time owner-approved C4.18 v121 publication

on:
  push:
    branches: [main]
    paths:
      - dev/docs/campaign20/C4_18_V121_RELEASE_HANDOFF_2026_11_15.md
      - .github/workflows/release-v121-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-v121-once:
    name: Dispatch owner-approved v121 verified Pages publication
    if: "${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(campaign): publish v121') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact release, previous production cache, and approved Dark V
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\n' < dev/version.json)" = '{"v":121}'
          grep -Fq "const VER = '5c7310b18b'" sw.js
          test -f dev/src/render3d/scenes/campaign-heir-crown.js
          grep -Fq "'D:4': Object.freeze" dev/src/data/campaign-map-presets.js
          grep -Fq "buildHeirCrown" dev/src/render3d/scenes/campaign-map.js
          grep -Fq "['D',4]" dev/tests/smoke/campaign-lifecycle.mjs
          grep -Fq "PASS C4.18 Heir Empty Crown real WebGL" dev/tests/smoke/campaign20.mjs
          test "$(git show --format=%s -s HEAD)" = "release(campaign): publish v121"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/validate-pwa.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
          echo "Owner-approved v121 validated publication dispatched for ${GITHUB_SHA}"
