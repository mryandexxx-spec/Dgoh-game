name: v84 one-time golden baseline refresh
on:
  push:
    branches: [release/v84-approved-features]
    paths:
      - .github/workflows/v84-golden-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node tests/smoke/v83-v85.mjs dist/pwa/index.html
      - run: node tests/smoke/memory-ix.mjs dist/pwa/index.html
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Refresh only four intentional v84 golden snapshots
        run: |
          node tests/run.mjs dist/artifact.html --update
          node tests/run.mjs dist/pwa/index.html
      - name: Validate snapshot set and scope
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import zlib from 'node:zlib';
          const base = 'tests/golden/data/';
          for (const n of ['battles','meta','saves','screens']) {
            const p = base+n+'.json.gz.b64';
            const json = JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync(p,'utf8').replace(/\s/g,''),'base64')));
            const values=json[n] || json.cases || json.saves || json.screens;
            const size=values?.length ?? 0;
            if ((n==='battles' && size!==200) || (n==='meta' && size<1000) || (n==='saves' && size!==4) || (n==='screens' && size<35)) throw Error(n+' invalid count '+size);
            if (n==='saves' && values.some(x=>x.startError)) throw Error('save migration startup errors');
            console.log(n, size, 'records validated');
          }
          JS
          git diff --name-only | tee /tmp/v84-golden-changes.txt
          if grep -Ev '^dev/tests/golden/data/(battles|meta|saves|screens)\.json\.gz\.b64$' /tmp/v84-golden-changes.txt; then echo 'UNEXPECTED CHANGED FILE'; exit 1; fi
      - name: Commit reviewed-scope v84 golden updates to release branch
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev/tests/golden/data/{battles,meta,saves,screens}.json.gz.b64
          if ! git diff --cached --quiet; then
            git commit -m "test(v84): update expected golden snapshots after approved legendary retirement"
            git push origin HEAD:release/v84-approved-features
          fi
